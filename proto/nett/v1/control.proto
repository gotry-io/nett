// The control protocol between nett-node and the Hub (docs/design/protocol.md). Each Envelope is
// one message on the Noise channel; field numbers are not reused, removed fields go into reserved;
// the 0 value of an enum is *_UNSPECIFIED (protocol.md section 4.2).
syntax = "proto3";

package nett.v1;

import "google/protobuf/timestamp.proto";

message Envelope {
  // Monotonically increasing in each direction
  uint64 id = 1;
  // When replying, set to the id of the peer's message
  uint64 reply_to = 2;
  google.protobuf.Timestamp sent_at = 3;
  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    Ping ping = 12;
    Pong pong = 13;
    Goodbye goodbye = 14;
    Error error = 15;
    Leave leave = 16;
    DesiredState desired_state = 20;
    StateAck state_ack = 21;
    Inventory inventory = 30;
    LinkReport link_report = 31;
    PathSwitch path_switch = 32;
    // An Envelope that exceeds the single-message limit is sent in fragments (protocol.md section
    // 4.1)
    Chunk chunk = 40;
  }
}

// node → Hub: payload of the first message of the Noise handshake (protocol.md section 3.3)
message Hello {
  // Supported protocol version, for example "1.0"
  repeated string protocol_versions = 1;
  string node_version = 2;
  string node_id = 3;
  // Random ID of this process start
  bytes boot_id = 4;
  // Desired state generation already applied locally
  uint64 applied_generation = 5;
  repeated string capabilities = 6;
  // Only at enrollment: the JSON of the admission proof (auth.md sections 8.2, 10.5); the identity
  // public key in it is the one used for the handshake
  bytes admission_proof = 7;
}

// Hub → node: payload of the second message of the Noise handshake
message Welcome {
  string protocol_version = 1;
  string hub_version = 2;
  string session_id = 3;
  google.protobuf.Timestamp server_time = 4;
  uint32 keepalive_secs = 5;
}

message Ping {}

message Pong {
  google.protobuf.Timestamp server_time = 1;
}

message Goodbye {
  string reason = 1;
}

// node → Hub: a node leaves on its own (nett leave, auth.md section 8.3). The Hub then removes this
// machine
message Leave {}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  NODE_UNKNOWN = 1;
  NODE_REVOKED = 2;
  UPGRADE_REQUIRED = 3;
  INVALID_MESSAGE = 4;
  RATE_LIMITED = 5;
  // Enrollment rejected: token expired, machine already enrolled, or wrong admission proof; the
  // reason is in message
  ENROLLMENT_REFUSED = 6;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  uint64 related_id = 3;
}

enum PartitionKind {
  PARTITION_KIND_UNSPECIFIED = 0;
  TRUST = 1;
  POLICY = 2;
  HUB_ENDPOINTS = 3;
  RELEASE = 4;
  MESH = 5;
}

// One partition of the desired state. The content of the mesh partition is the desired state file
// of local signing (JSON, protocol.md section 6), which nett-node writes to the mesh process as is;
// the hub_endpoints partition is a JSON array of strings
message Partition {
  PartitionKind kind = 1;
  bytes content = 2;
}

// Hub → node: desired state. A full snapshot when base_generation is 0
message DesiredState {
  uint64 generation = 1;
  uint64 base_generation = 2;
  repeated Partition partitions = 3;
}

enum AckResult {
  ACK_RESULT_UNSPECIFIED = 0;
  APPLIED = 1;
  REJECTED = 2;
  PENDING = 3;
}

message PartitionAck {
  PartitionKind kind = 1;
  AckResult result = 2;
  string reason = 3;
}

// node → Hub: result of applying the desired state, reported per partition
message StateAck {
  uint64 generation = 1;
  repeated PartitionAck partitions = 2;
}

// node → Hub: version, platform, and the address this machine used to connect to the Hub (hub.md
// section 5)
message Inventory {
  string nett_version = 1;
  string platform = 2;
  repeated string addresses = 3;
}

// node → Hub: the mesh process's local status (JSON in design/status.md section 6), displayed by
// nett site status
message LinkReport {
  bytes status = 1;
}

// Both directions: a switch proposal or confirmation between two dial-only members whose tunnel is
// down (design/mesh.md section 8.4). node → Hub: node_id is the peer it is for; Hub → node: the
// peer it came from. The message is authenticated end to end by the two mesh processes and opaque
// to nett-node and the Hub, which passes it on only between members the site connects
message PathSwitch {
  string node_id = 1;
  bytes message = 2;
}

message Chunk {
  uint64 stream_id = 1;
  uint32 seq = 2;
  bool last = 3;
  bytes data = 4;
}
