# Checks for dependency licenses, security advisories, duplicate dependencies and sources (CLAUDE.md
# "Technology stack")

[graph]
all-features = true

[advisories]
ignore = [
    # sqlx 0.9.0 limits libsqlite3-sys to below 0.38, and the fix is in 0.39 (SQLite 3.54). It
    # matters only when opening a database and -wal file written by a lower-privileged party; the
    # Hub only opens the database it wrote itself in its own data directory (0700). Upgrade and
    # remove this entry once sqlx lifts the limit; the upgrade is required before restoring from
    # backup (design/hub.md section 9 H5)
    { id = "RUSTSEC-2026-0459", reason = "Hub opens only its own database; upgrade when sqlx allows libsqlite3-sys 0.39" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The allow list is policy; it does not require every entry to currently be used by some dependency
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
