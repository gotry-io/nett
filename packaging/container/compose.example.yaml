# A service that is a member of the mesh of its own. The nett container joins the site and holds the
# mesh interface; the service shares its network, so other members reach the service at this
# member's mesh address, as the access rules allow, and the service sees each caller's mesh address.
#
# On the computer that holds the site:
#   nett site add app-box          prints the token for NETT_TOKEN below
#   nett site allow <from> app-box 8080/tcp
# Then: docker compose up -d
# The container upgrades itself with each release; the image tag is the version it starts from.
services:
  nett:
    image: ghcr.io/gotry-io/nett:latest
    environment:
      # Read on the first start only; the member's identity then lives in the volume
      NETT_TOKEN: nett_enr_…
    volumes:
      - nett-state:/var/lib/nett
    cap_add: [NET_ADMIN, NET_RAW]
    # Only when the host kernel has no WireGuard
    # devices: ["/dev/net/tun:/dev/net/tun"]
    restart: unless-stopped

  app:
    image: example/app
    # Listens in the nett container's network, on port 8080
    network_mode: service:nett
    depends_on: [nett]
    restart: unless-stopped

volumes:
  nett-state:
