# 容器内成员（ADR 0016，design/local-signing.md 第 6 节）：这个容器网络的智能入口。它在网络中使用固定地址，
# 只把 Edge 专用地址发来、访问规则放行的连接转给宣告的服务地址，来源换成自己的地址。服务保留自己的网络，
# 也使用固定地址；容器内成员重启不影响服务。
#
# 第一次使用：docker compose run --rm nett mesh keys --dir /etc/nett，把输出的一行写进站点描述，在其中
# 写上 routes = ["172.30.0.10/32"]；nett site build 生成的 desired.json 放进
# ./nett；之后更新时 docker compose kill -s HUP nett。
services:
  nett:
    image: nett
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"       # 只转发访问规则放行的连接
    volumes:
      - ./nett:/etc/nett
    networks:
      app:
        ipv4_address: 172.30.0.200
    restart: unless-stopped

  app:
    image: example/app
    networks:
      app:
        ipv4_address: 172.30.0.10    # 在站点描述中宣告的地址
    restart: unless-stopped
    # 需要真实客户端 IP 的服务：可信代理设为 172.30.0.200

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.0/25    # 动态分配的范围；固定地址取在它之外
