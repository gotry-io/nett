# A mesh member inside a container, acting as the gateway into this container network. It has a
# fixed address and forwards only connections the access rules allow to the advertised service
# address, rewriting the source to its own address. The service keeps its own network and fixed
# address; restarting the mesh member does not affect it.
#
# First use: `docker run --rm --network none -v ./nett:/etc/nett nett keys --dir /etc/nett`; on the
# computer that holds the site, `nett site add <name> --keys "…"` with the printed line, then
# `nett site routes <name> 172.30.0.10/32`; put the generated desired.json in ./nett.
# After an update, `docker compose exec nett /nett reload` reports whether it was accepted.
# Avoid `docker compose kill`: Docker records the container as stopped by hand and does not start
# it after a reboot. Avoid `docker compose run` for one-off tasks: the temporary container takes
# the same fixed address as the running one.
services:
  nett:
    image: nett
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"       # only connections the access rules allow are forwarded
    volumes:
      - ./nett:/etc/nett
    networks:
      app:
        ipv4_address: 172.30.0.200
    restart: unless-stopped

  app:
    image: example/app
    networks:
      app:
        ipv4_address: 172.30.0.10    # the address advertised in the site
    restart: unless-stopped
    # Services that need the real client IP: trust 172.30.0.200 as the proxy

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.0/25    # dynamic range; fixed addresses lie outside it
