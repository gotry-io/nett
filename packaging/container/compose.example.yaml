# 以边车运行的容器内成员（ADR 0016，design/local-signing.md 第 6 节）：服务与它共用网络命名空间，组网流量
# 直接到达服务，服务看到的来源就是 Edge 专用地址。服务的网络和发布端口写在边车上。
#
# 第一次使用：docker compose run --rm nett mesh keys --dir /etc/nett，把输出的一行写进站点描述；
# nett site build 生成的 desired.json 放进 ./nett；之后更新时 docker compose kill -s HUP nett。
services:
  nett:
    image: nett
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./nett:/etc/nett
    networks: [app]
    # ports:            # 服务原来的发布端口写在这里
    #   - "8686:8686"
    restart: unless-stopped

  app:
    image: example/app
    network_mode: "service:nett"
    depends_on: [nett]
    restart: unless-stopped
    # 需要真实客户端 IP 的服务：把可信代理设为 Edge 专用地址

networks:
  app: {}
