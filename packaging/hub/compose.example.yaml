# nett-hub behind Caddy. Caddy obtains the certificate, terminates TLS and forwards /api/v1/ and
# the node gateway /node/v1/connect to the Hub, which listens only on the container network.
# Replace hub.example.com with the Hub's domain here and in the Caddyfile; its A/AAAA records point
# to this host.
#
# First use:
#   docker compose run --rm hub init --url https://hub.example.com --data /data
#   docker compose up -d
# Then, within an hour, run the printed `nett site link nett_lnk_…` on the computer that holds the site.
# To unlink the site: docker compose exec hub /nett-hub reset --data /data
services:
  hub:
    image: nett-hub
    volumes:
      - hub-data:/data
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  hub-data:
  caddy-data:
