[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gotry-io/nett"
publish = false

# 依赖的版本集中在这里，各 crate 用 `workspace = true` 引用；默认特性一律关闭，按需开启
[workspace.dependencies]
nett-core = { path = "crates/nett-core" }
nett-trust = { path = "crates/nett-trust" }
nett-mesh = { path = "crates/nett-mesh" }
nett-relay = { path = "crates/nett-relay" }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
blake2 = { version = "0.11.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
lexopt = { version = "0.3.2", default-features = false }
libc = { version = "0.2.191", default-features = false }
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "net"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
toml = { version = "1.2.0", default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

# 每个 crate 用 `[lints] workspace = true` 继承这里的规则（CLAUDE.md "代码规则"）
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
