[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gotry-io/nett"
publish = false

# 依赖的版本集中在这里，各 crate 用 `workspace = true` 引用；默认特性一律关闭，按需开启
[workspace.dependencies]
nett-core = { path = "crates/nett-core" }
nett-trust = { path = "crates/nett-trust" }
nett-mesh = { path = "crates/nett-mesh" }
nett-site = { path = "crates/nett-site" }
nett-proto = { path = "crates/nett-proto" }
nett-node = { path = "crates/nett-node" }
nett-hub = { path = "crates/nett-hub" }
nett-relay = { path = "crates/nett-relay" }
nett-transport = { path = "crates/nett-transport" }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
blake2 = { version = "0.11.0", default-features = false }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
# 用户态 WireGuard 的会话层：只用 noise 层，AEAD 用 ring（design/userspace.md 第 3 节）
gotatun = { version = "=0.10.2", default-features = false, features = ["ring"] }
lexopt = { version = "0.3.2", default-features = false }
prost = { version = "0.14.4", default-features = false, features = ["std", "derive"] }
prost-types = { version = "0.14.4", default-features = false, features = ["std"] }
libc = { version = "0.2.191", default-features = false }
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "net"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# Hub 有公网证书时（在反向代理之后）按系统的根证书校验（硬性规则 11）
rustls-native-certs = { version = "0.8.5", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
toml = { version = "1.2.0", default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

# 每个 crate 用 `[lints] workspace = true` 继承这里的规则（CLAUDE.md "代码规则"）
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
