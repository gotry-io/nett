# Acceptance comparison against Tailscale (design/prototype.md sections 5.1, 6, 7): triggered
# manually, not run on every push.
# One job per scenario, run in parallel: 20 runs each for interruption and recovery scenarios; 5
# minutes and 3 runs each for fluctuation scenarios (including congestion); scenario 17's clock skew
# is split into two groups, 1.5 seconds (by time slice) and 5 seconds (random-interval retries);
# scenarios 19-21 apply to nett only (section 6.3).
# Downloaded tools are pinned to versions and hash-verified; third-party actions are pinned to
# commit hashes. A manual trigger can select just one scenario.

name: Lab baseline

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Run only this one scenario (the name in the matrix, for example 2-relay-loss); leave empty to run all
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAILSCALE_VERSION: "1.104.5"
  TAILSCALE_SHA256: "720cbbccbfc03d8b55df72afc19e5a72e31b0f65934700aa6fa38074d4ad7bf7"
  HEADSCALE_VERSION: "0.29.7"
  HEADSCALE_SHA256: "e827fc9b12d958bc95b081c4401dd63f8e0471d025b45b508535a920532150a8"
  # derper has the same version as Tailscale and is built from source
  GO_VERSION: "1.27.3"
  GO_SHA256: "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tailscale-deployment
            run: tailscale --topology crates/nett-lab/topologies/direct.toml
          - name: 1-8-failover
            run: failover --topology crates/nett-lab/topologies/failover.toml --repeat 20 --with-tailscale
          - name: 7-9-fallback
            run: fallback --topology crates/nett-lab/topologies/fallback.toml --repeat 20 --with-tailscale
          - name: 10-punch-cone
            run: punch --topology crates/nett-lab/topologies/punch-cone.toml --repeat 20 --with-tailscale
          - name: 11-punch-ipv6
            run: punch --topology crates/nett-lab/topologies/punch-ipv6.toml --repeat 20 --with-tailscale
          - name: 12-punch-mixed
            run: punch --topology crates/nett-lab/topologies/punch-mixed.toml --repeat 20 --with-tailscale
          - name: 13-punch-symmetric
            run: punch --topology crates/nett-lab/topologies/punch-symmetric.toml --repeat 20 --with-tailscale
          - name: 2-relay-loss
            run: relay-loss --topology crates/nett-lab/topologies/relays.toml --repeat 20 --with-tailscale
          - name: 3-relay-restart
            run: relay-restart --topology crates/nett-lab/topologies/relays.toml --repeat 20 --with-tailscale
          - name: 4-loss-5
            run: loss --level 5 --duration 300 --topology crates/nett-lab/topologies/relays.toml --repeat 3 --with-tailscale
          - name: 4-loss-15
            run: loss --level 15 --duration 300 --topology crates/nett-lab/topologies/relays.toml --repeat 3 --with-tailscale
          - name: 4-loss-30
            run: loss --level 30 --duration 300 --topology crates/nett-lab/topologies/relays.toml --repeat 3 --with-tailscale
          - name: 5-jitter-20
            run: jitter --level 20 --duration 300 --topology crates/nett-lab/topologies/relays.toml --repeat 3 --with-tailscale
          - name: 5-jitter-80
            run: jitter --level 80 --duration 300 --topology crates/nett-lab/topologies/relays.toml --repeat 3 --with-tailscale
          - name: 5-alternate
            run: alternate --level 40 --duration 600 --topology crates/nett-lab/topologies/relays.toml --repeat 3 --with-tailscale
          - name: 6-flap
            run: flap --duration 300 --topology crates/nett-lab/topologies/relays.toml --repeat 3 --with-tailscale
          - name: 24-congestion-relay
            run: congestion --duration 300 --topology crates/nett-lab/topologies/relay-only.toml --repeat 3 --with-tailscale
          - name: 24-congestion-direct
            run: congestion --duration 300 --topology crates/nett-lab/topologies/fallback.toml --repeat 3 --with-tailscale
          - name: 15-roaming
            run: roaming --duration 600 --topology crates/nett-lab/topologies/failover.toml
          - name: 16-dial-only-switch
            run: dial-only-switch --topology crates/nett-lab/topologies/dial-pair.toml --repeat 20
          - name: 17-dial-only-outage
            run: dial-only-outage --clock-skew 1500 --topology crates/nett-lab/topologies/dial-pair.toml --repeat 20 --with-tailscale
          - name: 17-dial-only-outage-skewed
            run: dial-only-outage --clock-skew 5000 --topology crates/nett-lab/topologies/dial-pair.toml --repeat 20
          - name: 19-mtu-ipv4
            run: mtu --topology crates/nett-lab/topologies/mtu4.toml
          - name: 19-mtu-ipv6
            run: mtu --topology crates/nett-lab/topologies/mtu6.toml
          - name: 20ab-wg-rehandshake
            run: wg-rehandshake --topology crates/nett-lab/topologies/relays.toml --repeat 20
          - name: 20c-wg-cookie
            run: wg-cookie --topology crates/nett-lab/topologies/relays.toml
          - name: 20bd-wg-rekey
            run: wg-rekey --duration 1800 --topology crates/nett-lab/topologies/relays.toml
          # The resource budget applies to release builds: release, statically linked musl (hard
          # rule 14, architecture.md section 13.1)
          - name: 21-resources
            run: resources --duration 600 --topology crates/nett-lab/topologies/fallback.toml
            musl: true
    name: ${{ matrix.name }}
    env:
      SELECTED: ${{ inputs.scenario == '' || inputs.scenario == matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SELECTED == 'true'
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        if: env.SELECTED == 'true'
        run: rustup toolchain install
      - name: Install tools used by the lab network
        if: env.SELECTED == 'true'
        timeout-minutes: 10
        run: |
          sudo apt-get -c .github/apt.conf update
          sudo apt-get -c .github/apt.conf install -y --no-install-recommends wireguard-tools nftables iperf3 openssl tcpdump
      - name: Install Tailscale, Headscale and derper (pinned versions, hash-verified)
        if: env.SELECTED == 'true'
        run: |
          bin="$RUNNER_TEMP/baseline-bin"
          mkdir -p "$bin"
          ts="tailscale_${TAILSCALE_VERSION}_amd64"
          curl --fail --silent --show-error --location --max-time 300 -o "$ts.tgz" \
            "https://pkgs.tailscale.com/stable/$ts.tgz"
          echo "${TAILSCALE_SHA256}  $ts.tgz" | sha256sum --check -
          tar -xzf "$ts.tgz" --strip-components=1 -C "$bin" "$ts/tailscale" "$ts/tailscaled"
          hs="headscale_${HEADSCALE_VERSION}_linux_amd64"
          curl --fail --silent --show-error --location --max-time 300 -o "$bin/headscale" \
            "https://github.com/juanfont/headscale/releases/download/v${HEADSCALE_VERSION}/$hs"
          echo "${HEADSCALE_SHA256}  $bin/headscale" | sha256sum --check -
          chmod +x "$bin/headscale"
          go="go${GO_VERSION}.linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --max-time 300 -o "$go" "https://go.dev/dl/$go"
          echo "${GO_SHA256}  $go" | sha256sum --check -
          tar -xzf "$go" -C "$RUNNER_TEMP"
          GOBIN="$bin" "$RUNNER_TEMP/go/bin/go" install "tailscale.com/cmd/derper@v${TAILSCALE_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Check that kernel WireGuard is available
        if: env.SELECTED == 'true'
        run: |
          sudo modprobe wireguard
          sudo modprobe tun
      - run: cargo build --locked -p nett-cli -p nett-lab --features nett-cli/lab
        if: env.SELECTED == 'true'
      - name: Release build of nett (release, statically linked musl)
        if: env.SELECTED == 'true' && matrix.musl
        run: |
          sudo apt-get -c .github/apt.conf install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl -p nett-cli --features lab
          file target/x86_64-unknown-linux-musl/release/nett
      - name: ${{ matrix.name }}
        if: env.SELECTED == 'true'
        run: >-
          sudo env "PATH=$PATH" ./target/debug/nett-lab run ${{ matrix.run }}
          --nett ${{ matrix.musl && './target/x86_64-unknown-linux-musl/release/nett' || './target/debug/nett' }}
          --out "$RUNNER_TEMP/lab"
