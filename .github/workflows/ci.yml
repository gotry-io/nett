# Runs on pushes to main and on every pull request: format, clippy, tests, dependency checks, lab
# scenarios (CLAUDE.md "Commands").
# Third-party actions are pinned to commit hashes; downloaded tools are pinned to versions and
# hash-verified.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Every build in CI starts from a fresh checkout: incremental data only grows the cache
  CARGO_INCREMENTAL: "0"
  # Hub queries are checked at compile time against the committed .sqlx/: compilation fails when a
  # query changes and the offline data is not updated (CLAUDE.md "API, protocol and database")
  SQLX_OFFLINE: "true"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        run: rustup toolchain install
      # Dependencies and their build outputs (cargo's downloads and target/), keyed by the
      # dependencies in Cargo.lock without nett's own versions, so a release does not invalidate it.
      # Written only by pushes to main; pull requests read it
      - name: Dependency key
        id: deps
        run: |
          key=$(awk '/^name = "nett/ { skip = 1; next } skip { skip = 0; next } { print }' Cargo.lock \
            | cat - rust-toolchain.toml | shasum -a 256 | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.key }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Generated Protobuf types are committed in the repository (CLAUDE.md "API, protocol and
      # database"): regenerate them, and there must be no difference
      - name: Generated Protobuf types are up to date
        run: |
          cargo run --locked -p nett-proto-gen
          git diff --exit-code crates/nett-proto/src/gen
      # Install script for new machines (design/release.md section 6): POSIX sh only
      - run: shellcheck -s sh packaging/install.sh
      - name: Every guard in docs/failure-classes.md exists and runs in CI
        run: |
          shellcheck scripts/check-failure-classes.sh
          scripts/check-failure-classes.sh

  # macOS native member (design/userspace.md section 8): clippy, tests, and the utun smoke test that
  # needs root
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        run: rustup toolchain install
      # The dependency cache, as in the rust job
      - name: Dependency key
        id: deps
        run: |
          key=$(awk '/^name = "nett/ { skip = 1; next } skip { skip = 0; next } { print }' Cargo.lock \
            | cat - rust-toolchain.toml | shasum -a 256 | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.key }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: utun, addresses and routes (needs root)
        run: |
          cargo test --locked -p nett-mesh --lib --no-run
          test_bin=$(cargo test --locked -p nett-mesh --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "nett_mesh") | .executable')
          sudo "$test_bin" --ignored --exact macos::tests::macos_utun_smoke --nocapture
      # design/release.md section 4: the site is in the default directory, and install without
      # --config finds the desired state for this machine
      - name: Full flow of sudo nett install (needs root)
        run: |
          cargo build --locked -p nett-cli
          nett="$PWD/target/debug/nett"
          "$nett" site init
          keys=$(sudo "$nett" install | sed -n 's/^  nett site add <name> --keys "\(.*\)"$/\1/p')
          test -n "$keys"
          "$nett" site add ci --keys "$keys" --yes
          sudo "$nett" install | tee install.log
          grep -F "$HOME/.config/nett/nodes/ci/desired.json" install.log
          for _ in $(seq 20); do
            sudo launchctl print system/io.gotry.nett | grep -q 'state = running' && break
            sleep 0.5
          done
          sudo launchctl print system/io.gotry.nett | grep 'state = running'
          # Logs go to the system log only: no stderr path (design/release.md section 8)
          if grep -F StandardErrorPath /Library/LaunchDaemons/io.gotry.nett.plist; then exit 1; fi
          # Local status (design/status.md)
          for _ in $(seq 20); do
            sudo test -S /var/run/nett/mesh.sock && break
            sleep 0.5
          done
          sudo "$nett" status | tee status.log
          grep -F 'No peers.' status.log
          # Names (design/names-and-diagnostics.md section 3): this machine's own name, from its
          # responder and through the system resolver
          v4=$(sed -n 's/^mesh  *\([0-9.]*\),.*/\1/p' status.log)
          test -n "$v4"
          for _ in $(seq 20); do
            [ "$(dig +short +time=1 +tries=1 @"$v4" ci.nett.internal)" = "$v4" ] && break
            sleep 0.5
          done
          [ "$(dig +short +time=1 +tries=1 @"$v4" ci.nett.internal)" = "$v4" ]
          dscacheutil -q host -a name ci.nett.internal | grep -F "$v4"
          # Every local user reads the status, as with Tailscale; only root changes what the mesh
          # process does (design/status.md section 3)
          "$nett" status | grep -F 'No peers.'
          if "$nett" reload 2> reload.err; then exit 1; fi
          grep -F 'run with sudo' reload.err
          sudo "$nett" install | grep -F 'The service is running. Nothing changed.'
          # The desired state changed (same content, different bytes): reload over the local
          # interface and report the result
          python3 -m json.tool ~/.config/nett/nodes/ci/desired.json > reformatted.json
          sudo "$nett" install --config reformatted.json | grep -F 'Reloaded the desired state.'
          sudo "$nett" reload | grep -F 'Reloaded the desired state.'
          # A public relay with TLS gives this machine a path over TLS: the nett service carries it
          # itself, on a loopback port of its own; others reach the socket directory's names but
          # cannot list it
          relay_keys=$("$nett" keys --dir "$RUNNER_TEMP/relay1" \
            | sed -n 's/^  nett site add <name> --keys "\(.*\)"$/\1/p')
          test -n "$relay_keys"
          "$nett" site add relay1 --keys "$relay_keys" --public --ipv4 198.51.100.7 --yes
          "$nett" site relay relay1 --fingerprint "sha256:$(printf '%064d' 0)" --yes
          sudo "$nett" install
          for _ in $(seq 20); do
            log show --last 2m --predicate 'process == "nett"' | grep -q 'transport config applied' && break
            sleep 1
          done
          log show --last 2m --predicate 'process == "nett"' | grep -F 'transport config applied'
          pid=$(sudo launchctl print system/io.gotry.nett \
            | sed -n 's/^[[:space:]]*pid = \([0-9]*\)$/\1/p')
          sudo lsof -nP -a -p "$pid" -iUDP@127.0.0.1 | grep -F 'UDP 127.0.0.1:'
          [ "$(sudo stat -f %Lp /var/run/nett)" = 711 ]
          # Uninstalling removes nett and keeps the identity (design/release.md section 8)
          sudo "$nett" uninstall | tee uninstall.log
          grep -F "This machine's identity stays in /Library/Application Support/nett" uninstall.log
          if sudo launchctl print system/io.gotry.nett 2>/dev/null; then exit 1; fi
          for path in /Library/LaunchDaemons/io.gotry.nett.plist \
            '/Library/Application Support/nett/nett' /etc/resolver/nett.internal /var/run/nett; do
            if sudo test -e "$path"; then echo "$path remains"; exit 1; fi
          done
          sudo test -f '/Library/Application Support/nett/mesh.key'
      # design/hub.md sections 3.5, 7: an existing member joins the Hub. The Hub terminates TLS
      # locally with a test certificate, verified by fingerprint
      - name: sudo nett install <token> (join the Hub, needs root)
        run: |
          cargo build --locked -p nett-cli -p nett-hub
          nett="$PWD/target/debug/nett"
          hub="$PWD/target/debug/nett-hub"
          certs=crates/nett-hub/tests/data
          data="$RUNNER_TEMP/hub"
          code=$("$hub" init --data "$data" --url https://127.0.0.1:8443 --tls-cert "$certs/test-cert.pem" \
            | grep -o 'nett_lnk_[A-Za-z0-9_-]*')
          "$hub" serve --data "$data" --listen 127.0.0.1:8443 --releases off \
            --tls-cert "$certs/test-cert.pem" --tls-key "$certs/test-key.pem" 2> hub.log &
          for _ in $(seq 20); do grep -q 'Hub listening' hub.log && break; sleep 0.5; done
          "$nett" site link "$code" | grep -F 'Linked to https://127.0.0.1:8443'
          token=$("$nett" site invite ci | grep -o 'nett_enr_[A-Za-z0-9_-]*')
          sudo "$nett" install "$token" | tee join.log
          grep -F 'Connecting this machine to the Hub at https://127.0.0.1:8443' join.log
          for _ in $(seq 40); do
            "$nett" site status --json \
              | jq -e '.machines[] | select(.name == "ci") | .online and .result == "applied"' && break
            sleep 0.5
          done
          "$nett" site status | tee site-status.log
          grep -E '^ci +100\.88\.[0-9.]+ +online +[0-9.]+ +current' site-status.log
          # One service: it runs nett-node too (ADR 0013)
          log show --last 5m --predicate 'process == "nett"' | grep -F 'nett-node starting'
          # The service brings its launchd configuration up to its program when it starts, as after
          # an upgrade; launchd reads it the next time it loads the service
          sudo /usr/libexec/PlistBuddy -c 'Add :StandardErrorPath string /dev/null' \
            /Library/LaunchDaemons/io.gotry.nett.plist
          sudo launchctl kickstart -k system/io.gotry.nett
          for _ in $(seq 40); do grep -qF StandardErrorPath /Library/LaunchDaemons/io.gotry.nett.plist || break; sleep 0.5; done
          if grep -F StandardErrorPath /Library/LaunchDaemons/io.gotry.nett.plist; then exit 1; fi
          sudo launchctl print system/io.gotry.nett | grep 'state = running'
          # On a machine joined to the Hub, the desired state is written only by the nett service
          if sudo "$nett" install --config ~/.config/nett/nodes/ci/desired.json; then exit 1; fi
          sudo "$nett" uninstall
          if sudo launchctl print system/io.gotry.nett 2>/dev/null; then exit 1; fi
          # After leaving, the same Mac joins via the Hub as a new machine (design/hub.md sections
          # 3.3, 6), then leaves again
          sudo "$nett" leave | tee leave.log
          grep -F 'Told the Hub at https://127.0.0.1:8443' leave.log
          "$nett" site add ci-new --yes | tee add.log
          grep -F -- '- ci left the site' add.log
          token=$(grep -o 'nett_enr_[A-Za-z0-9_-]*' add.log)
          sudo "$nett" install "$token" | tee enroll.log
          grep -F 'Joining the site through the Hub at https://127.0.0.1:8443' enroll.log
          for _ in $(seq 40); do
            "$nett" site status --json \
              | jq -e '.machines[] | select(.name == "ci-new") | .online and .result == "applied"' && break
            sleep 0.5
          done
          "$nett" site status | tee site-status.log
          grep -E '^ci-new +100\.88\.[0-9.]+ +online +[0-9.]+ +current' site-status.log
          # The same machine retrying its token completes as usual (design/hub.md section 6); another
          # machine using it is refused, which the Hub's enrollment tests cover
          sudo "$nett" install "$token" | grep -F 'This machine has already joined the site through the Hub.'
          sudo "$nett" leave
          if sudo launchctl print system/io.gotry.nett 2>/dev/null; then exit 1; fi
          # After leaving and uninstalling, nothing of nett remains (design/release.md section 8)
          sudo "$nett" uninstall | grep -F 'Nothing of it remains on this machine.'
          for path in '/Library/Application Support/nett' /Library/LaunchDaemons/io.gotry.nett.plist \
            /etc/resolver/nett.internal /var/run/nett; do
            if sudo test -e "$path"; then echo "$path remains"; exit 1; fi
          done


  # Linux with real systemd (design/hub.md section 7, design/release.md sections 7 and 8): a new
  # machine joins through the Hub with `sudo nett install <token>`, waits for approval, then upgrades
  # itself to newer releases that a local website serves (signed with keys generated for this test
  # and built into each version) and the Hub mirrors, and leaves again
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # The same pinned minisign as the release workflow
      MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        run: rustup toolchain install
      # Release key rotation (design/auth.md section 11.3): this version trusts an old primary and
      # backup key; 99.0.0, signed by the old backup key, carries a new pair
      # The dependency cache, as in the rust job
      - name: Dependency key
        id: deps
        run: |
          key=$(awk '/^name = "nett/ { skip = 1; next } skip { skip = 0; next } { print }' Cargo.lock \
            | cat - rust-toolchain.toml | shasum -a 256 | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ${{ runner.temp }}/next-target/
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.key }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Release keys for this test
        run: |
          curl -fsSL -o minisign.tar.gz "$MINISIGN_URL"
          echo "$MINISIGN_SHA256  minisign.tar.gz" | sha256sum -c -
          tar -xzf minisign.tar.gz minisign-linux/x86_64/minisign
          for key in old-primary old-backup new-primary new-backup; do
            minisign-linux/x86_64/minisign -G -W -p "$RUNNER_TEMP/$key.pub" -s "$RUNNER_TEMP/$key.key"
          done
      - name: Build this version with the old keys, and 99.0.0, 99.2.0 and the Hub with the new ones
        run: |
          NETT_RELEASE_PUBLIC_KEYS="$(cat "$RUNNER_TEMP/old-primary.pub" "$RUNNER_TEMP/old-backup.pub")" \
            cargo build --locked -p nett-cli
          NETT_RELEASE_PUBLIC_KEYS="$(cat "$RUNNER_TEMP/new-primary.pub" "$RUNNER_TEMP/new-backup.pub")"
          export NETT_RELEASE_PUBLIC_KEYS
          # The Hub trusts the keys of 99.x, as one upgraded to a release that carries them: it
          # mirrors what they signed (ADR 0025) and does not serve the rest
          cargo build --locked -p nett-hub
          next="$RUNNER_TEMP/next"
          mkdir -p "$next" "$RUNNER_TEMP/site/dl"
          tar --exclude=./target --exclude=./.git -cf - . | tar -xf - -C "$next"
          for version in 99.0.0 99.2.0; do
            sed -i "0,/^version = \".*\"/s//version = \"$version\"/" "$next/Cargo.toml"
            # A release build, like the programs nodes download (a debug build exceeds the size limit)
            (cd "$next" && cargo update --workspace --offline && CARGO_TARGET_DIR="$PWD/../next-target" cargo build --release -p nett-cli)
            cp "$RUNNER_TEMP/next-target/release/nett" "$RUNNER_TEMP/site/dl/nett-$version-x86_64-unknown-linux-musl"
          done
          # 99.1.0 is only ever rejected: the 99.0.0 program under its name is enough
          cp "$RUNNER_TEMP/site/dl/nett-99.0.0-x86_64-unknown-linux-musl" "$RUNNER_TEMP/site/dl/nett-99.1.0-x86_64-unknown-linux-musl"
          cat > "$RUNNER_TEMP/offer.sh" <<'SH'
          # offer.sh <version> <key>: sign that program with that key and make it the release the Hub relays
          set -eu
          site="$RUNNER_TEMP/site" program="nett-$1-x86_64-unknown-linux-musl"
          rm -f "$site/dl/$program.minisig"
          minisign-linux/x86_64/minisign -S -s "$RUNNER_TEMP/$2.key" -m "$site/dl/$program" -t "nett v$1 $program"
          jq -n --arg v "$1" --arg sha "$(sha256sum "$site/dl/$program" | cut -d' ' -f1)" --rawfile sig "$site/dl/$program.minisig" \
            '{version: $v, programs: {"x86_64-unknown-linux-musl": {url: ("https://127.0.0.1:8444/dl/nett-" + $v + "-x86_64-unknown-linux-musl"), sha256: $sha, minisig: $sig}}}' \
            > "$site/release.json"
          SH
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ${{ runner.temp }}/next-target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Serve the newer release over HTTPS
        run: |
          site="$RUNNER_TEMP/site"
          sh "$RUNNER_TEMP/offer.sh" 99.0.0 old-backup
          # A throwaway CA, trusted system-wide for this run only, and a certificate for 127.0.0.1
          tls="$RUNNER_TEMP/tls"
          mkdir -p "$tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj /CN=nett-test-ca -keyout "$tls/ca.key" -out "$tls/ca.pem"
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=127.0.0.1 \
            -keyout "$tls/site.key" -out "$tls/site.csr"
          printf 'subjectAltName=IP:127.0.0.1\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' \
            > "$tls/site.ext"
          openssl x509 -req -in "$tls/site.csr" -CA "$tls/ca.pem" -CAkey "$tls/ca.key" -CAcreateserial \
            -days 1 -extfile "$tls/site.ext" -out "$tls/site.pem"
          sudo cp "$tls/ca.pem" /usr/local/share/ca-certificates/nett-test.crt
          sudo update-ca-certificates
          cat > "$RUNNER_TEMP/serve.py" <<'PY'
          import functools, http.server, ssl, sys
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=sys.argv[1])
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 8444), handler)
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain(sys.argv[2], sys.argv[3])
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PY
          python3 "$RUNNER_TEMP/serve.py" "$site" "$tls/site.pem" "$tls/site.key" 2> site.log &
          for _ in $(seq 20); do curl -fsS https://127.0.0.1:8444/release.json > /dev/null && break; sleep 0.5; done
      - name: Join through the Hub, upgrade, rotate the release keys, leave (needs root)
        run: |
          nett="$PWD/target/debug/nett"
          hub="$PWD/target/debug/nett-hub"
          certs=crates/nett-hub/tests/data
          data="$RUNNER_TEMP/hub"
          code=$("$hub" init --data "$data" --url https://127.0.0.1:8443 --tls-cert "$certs/test-cert.pem" \
            | grep -o 'nett_lnk_[A-Za-z0-9_-]*')
          # The Hub fetches the release manifest when it starts: restarting it relays a new one
          serve_hub() {
            started=$(grep -c 'Hub listening' hub.log 2>/dev/null || true)
            "$hub" serve --data "$data" --listen 127.0.0.1:8443 --tls-cert "$certs/test-cert.pem" \
              --tls-key "$certs/test-key.pem" --releases https://127.0.0.1:8444/release.json 2>> hub.log &
            hub_pid=$!
            for _ in $(seq 20); do
              [ "$(grep -c 'Hub listening' hub.log)" -gt "${started:-0}" ] && break
              sleep 0.5
            done
          }
          serve_hub
          "$nett" site init
          "$nett" site link "$code" | grep -F 'Linked to https://127.0.0.1:8443'
          "$nett" site add ci --yes | tee add.log
          token=$(grep -o 'nett_enr_[A-Za-z0-9_-]*' add.log)
          own=$("$nett" --version | awk '{print $2}')
          sudo "$nett" install "$token" | tee install.log
          grep -F 'Joining the site through the Hub at https://127.0.0.1:8443' install.log
          test "$(readlink /usr/local/bin/nett)" = /usr/local/lib/nett/nett
          # One service, as root; the identity is root's alone (ADR 0013)
          systemctl is-active --quiet nett.service
          [ "$(ps -o uid= -p "$(systemctl show -p MainPID --value nett.service)" | tr -d ' ')" = 0 ]
          test "$(sudo stat -c '%a %U' /etc/nett)" = "700 root"
          test "$(sudo stat -c '%a %U' /etc/nett/desired.json)" = "600 root"
          # The relay's unit exists only while the desired state needs it (design/release.md section 8)
          units=/usr/local/lib/systemd/system
          test ! -e "$units/nett-relay.service"
          # The Hub holds 99.0.0, signed by the old backup key, and relays it once it is approved
          # (ADR 0027): the nett service verifies it, installs it and exits, and systemd starts the
          # new program
          wait_for() {
            for _ in $(seq 120); do
              "$nett" site status --json | jq -e ".machines[] | select(.name == \"ci\") | $1" && return 0
              sleep 1
            done
            "$nett" site status --json | jq '.machines[] | select(.name == "ci")'
            return 1
          }
          approve() {
            for _ in $(seq 60); do
              "$nett" site status --json | jq -e ".release == \"$1\"" > /dev/null && break
              sleep 1
            done
            "$nett" site upgrade --yes
          }
          for _ in $(seq 60); do
            "$nett" site status --json | jq -e '.release == "99.0.0"' > /dev/null && break
            sleep 1
          done
          sleep 5
          "$nett" site status | grep -F '99.0.0 available for the Hub and 1 machine: nett site upgrade'
          wait_for ".online and .nett_version == \"$own\""
          approve 99.0.0
          wait_for '.online and .nett_version == "99.0.0"'
          "$nett" site status | tee site-status.log
          grep -E '^ci +100\.88\.[0-9.]+ +online +99\.0\.0 ' site-status.log
          test -f /usr/local/lib/nett/nett.previous
          # The new program reaches the Hub while systemd still runs ExecStartPost
          for _ in $(seq 20); do systemctl is-active --quiet nett.service && break; sleep 0.5; done
          systemctl is-active --quiet nett.service
          sudo journalctl -u nett --no-pager | grep -F 'nett exits to run the new version'
          test "$(sudo stat -c '%a %U' /etc/nett/state)" = "700 root"
          sudo test -f /etc/nett/state/trust.json
          wait_for '.online and .result == "applied"'
          # 99.0.0 trusts only the new keys: 99.1.0 signed by the old primary key is refused
          sh "$RUNNER_TEMP/offer.sh" 99.1.0 old-primary
          kill "$hub_pid"; wait "$hub_pid" || true
          serve_hub
          approve 99.1.0
          wait_for '.upgrade_result == "rejected" and (.upgrade_reason | contains("does not trust"))'
          wait_for '.online and .nett_version == "99.0.0"'
          # The Hub did not serve it either: the node fetched it from the website
          grep -F 'the program of the release does not verify' hub.log | grep -F 99.1.0
          # ... and 99.2.0 signed by the new primary key is installed, fetched through the Hub,
          # which holds it before it relays the manifest
          sh "$RUNNER_TEMP/offer.sh" 99.2.0 new-primary
          kill "$hub_pid"; wait "$hub_pid" || true
          serve_hub
          approve 99.2.0
          wait_for '.online and .nett_version == "99.2.0"'
          grep -F 'holding the program of the release' hub.log | grep -F 99.2.0
          sudo journalctl -u nett --no-pager | grep -F 'fetched and verified the new version' \
            | grep -F 99.2.0 | grep -F 'the Hub'
          sudo journalctl -u nett --no-pager | tail -20
          # A public relay with TLS gives this machine a path over TLS: the nett service carries it
          # itself, with no unit of its own
          relay_keys=$("$nett" keys --dir "$RUNNER_TEMP/relay1" \
            | sed -n 's/^  nett site add <name> --keys "\(.*\)"$/\1/p')
          "$nett" site add relay1 --keys "$relay_keys" --public --ipv4 198.51.100.7 --yes
          "$nett" site relay relay1 --fingerprint "sha256:$(printf '%064d' 0)" --yes
          for _ in $(seq 60); do
            sudo journalctl -u nett --no-pager | grep -q 'transport config applied' && break
            sleep 1
          done
          sudo journalctl -u nett --no-pager | grep -F 'transport config applied'
          test ! -e "$units/nett-transport.service"
          "$nett" site remove relay1 --yes
          sudo nett leave | tee leave.log
          grep -F 'Told the Hub at https://127.0.0.1:8443' leave.log
          if systemctl is-active --quiet nett.service; then exit 1; fi
          if ip link show nett0 2>/dev/null; then exit 1; fi
          test ! -e /etc/nett/identity.key
          # Joined again as a public machine, it runs a relay: the nett service creates the
          # certificate in /etc/nett/relay, the relay runs as a user systemd allocates, and the nett
          # service, which knows it by its unit, hands it its assignment
          "$nett" site add ci-relay --public --ipv4 198.51.100.8 --yes | tee add-relay.log
          token=$(grep -o 'nett_enr_[A-Za-z0-9_-]*' add-relay.log)
          sudo nett install "$token"
          "$nett" site relay ci-relay --yes
          for _ in $(seq 60); do systemctl is-active --quiet nett-relay.service && break; sleep 1; done
          systemctl is-active --quiet nett-relay.service
          test "$(sudo stat -c '%a %U' /etc/nett/relay)" = "700 root"
          sudo test -f /etc/nett/relay/tls-key.pk8
          pid=$(systemctl show -p MainPID --value nett-relay.service)
          [ "$(ps -o uid= -p "$pid" | tr -d ' ')" -ge 61184 ]
          for _ in $(seq 30); do
            sudo nett status --json | jq -e '.relay.fingerprint' > /dev/null && break
            sleep 1
          done
          sudo nett status --json | jq -e '.relay.fingerprint'
          sudo nett leave
          # After leaving and uninstalling, nothing of nett remains (design/release.md section 8)
          sudo nett uninstall | tee uninstall.log
          grep -F 'Nothing of it remains on this machine.' uninstall.log
          for path in /usr/local/lib/nett /usr/local/bin/nett /etc/nett /run/nett /run/nett-relay \
            "$units/nett.service" "$units/nett-relay.service"; do
            if sudo test -e "$path"; then echo "$path remains"; exit 1; fi
          done
          # nett adds no account to the system
          if getent passwd nett || getent group nett; then exit 1; fi
          if command -v nft > /dev/null && sudo nft list tables | grep -F nett_; then exit 1; fi
      - name: Logs on failure
        if: failure()
        run: |
          cat hub.log site.log || true
          sudo journalctl -u nett -u nett-relay --no-pager | tail -80 || true

  # The container and the Hub upgrade themselves (design/container.md, ADR 0026): nett's image joins
  # through a Hub with NETT_TOKEN, two dial-only containers on one network with the Hub and no relay
  # reach each other over that network (design/mesh.md section 6), a service in its network sees each
  # caller's mesh address, the Hub and the containers move in place to 99.0.0, signed with a key
  # generated for this test and built into each version, and a signed release that does not start is
  # rolled back
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The same pinned minisign as the release workflow
      MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml, and musl
        timeout-minutes: 10
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get -c .github/apt.conf update
          sudo apt-get -c .github/apt.conf install -y --no-install-recommends musl-tools
      # The dependency cache, as in the rust job
      - name: Dependency key
        id: deps
        run: |
          key=$(awk '/^name = "nett/ { skip = 1; next } skip { skip = 0; next } { print }' Cargo.lock \
            | cat - rust-toolchain.toml | shasum -a 256 | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.key }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - name: A release key for this test
        run: |
          curl -fsSL -o minisign.tar.gz "$MINISIGN_URL"
          echo "$MINISIGN_SHA256  minisign.tar.gz" | sha256sum -c -
          tar -xzf minisign.tar.gz minisign-linux/x86_64/minisign
          minisign-linux/x86_64/minisign -G -W -p "$RUNNER_TEMP/test.pub" -s "$RUNNER_TEMP/test.key"
      - name: Build this version and 99.0.0 of nett and nett-hub, statically linked
        run: |
          NETT_RELEASE_PUBLIC_KEYS="$(cat "$RUNNER_TEMP/test.pub")"
          export NETT_RELEASE_PUBLIC_KEYS
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cargo build --release --locked --target x86_64-unknown-linux-musl -p nett-cli -p nett-hub
          cp target/x86_64-unknown-linux-musl/release/nett "$out/nett-current"
          cp target/x86_64-unknown-linux-musl/release/nett-hub "$out/nett-hub-current"
          next="$RUNNER_TEMP/next"
          mkdir -p "$next"
          tar --exclude=./target --exclude=./.git -cf - . | tar -xf - -C "$next"
          sed -i '0,/^version = ".*"/s//version = "99.0.0"/' "$next/Cargo.toml"
          # The same target directory: the dependencies are built once, only nett's own crates again
          (cd "$next" && cargo update --workspace --offline \
            && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release --target x86_64-unknown-linux-musl -p nett-cli -p nett-hub)
          cp target/x86_64-unknown-linux-musl/release/nett "$out/nett-99.0.0"
          cp target/x86_64-unknown-linux-musl/release/nett-hub "$out/nett-hub-99.0.0"
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Join, reach a service beside a container over the LAN, upgrade in place, roll back (needs Docker)
        run: |
          out="$RUNNER_TEMP/out" data="$RUNNER_TEMP/hub-data" site="$RUNNER_TEMP/site"
          mkdir -p "$site" "$RUNNER_TEMP/home"
          # Owned by root, as Docker creates a volume: the Hub runs as root without capabilities,
          # and writes only where it owns the directory
          sudo install -d -m 0700 "$data"
          export HOME="$RUNNER_TEMP/home"
          nett="$out/nett-current"
          for image in nett nett-hub; do
            context="$RUNNER_TEMP/image-$image"
            mkdir -p "$context"
            cp /etc/ssl/certs/ca-certificates.crt "$context/"
            cp "$out/$image-current" "$context/$image-amd64"
            dir=container
            [ "$image" = nett-hub ] && dir=hub
            docker build -q -t "$image:ci" -f "packaging/$dir/Dockerfile" "$context"
          done
          # offer <version> <nett program> [<nett-hub program>]: signs them as that release, puts
          # them where the Hub's mirror finds them (it verifies them instead of fetching), and
          # writes the manifest it reads at start
          offer() {
            programs='{}'
            for pair in "x86_64-unknown-linux-musl:$2" "hub-x86_64-unknown-linux-musl:${3:-}"; do
              target=${pair%%:*} src=${pair#*:}
              [ -n "$src" ] || continue
              name="nett-$1-$target"
              cp "$src" "$RUNNER_TEMP/$name"
              rm -f "$RUNNER_TEMP/$name.minisig"
              minisign-linux/x86_64/minisign -S -s "$RUNNER_TEMP/test.key" -m "$RUNNER_TEMP/$name" -t "nett v$1 $name" < /dev/null
              sudo mkdir -p "$data/releases"
              sudo cp "$RUNNER_TEMP/$name" "$data/releases/$name"
              programs=$(jq --arg t "$target" --arg url "https://nett.example.com/dl/$name" \
                --arg sha "$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)" --rawfile sig "$RUNNER_TEMP/$name.minisig" \
                '. + {($t): {url: $url, sha256: $sha, minisig: $sig}}' <<< "$programs")
            done
            jq -n --arg v "$1" --argjson programs "$programs" '{version: $v, programs: $programs}' > "$site/release.json"
          }
          status() { "$nett" site status --json | jq -e "$1" > /dev/null; }
          wait_for() {
            for _ in $(seq 90); do status "$1" && return 0; sleep 2; done
            "$nett" site status
            return 1
          }
          # ask <container> <command>: runs a command in a container's network, as a service
          # beside it does
          ask() { sudo nsenter -t "$(docker inspect -f '{{.State.Pid}}' "$1")" -n -- bash -c "$2"; }
          echo '{"version": "0.0.1", "programs": {}}' > "$site/release.json"
          docker network create --subnet 172.31.0.0/24 nett-ci
          certs="$PWD/crates/nett-hub/tests/data"
          code=$(docker run --rm -v "$data":/data -v "$certs":/certs:ro nett-hub:ci init --data /data \
            --url https://172.31.0.10:8443 --tls-cert /certs/test-cert.pem | grep -o 'nett_lnk_[A-Za-z0-9_-]*')
          docker run -d --name hub --network nett-ci --ip 172.31.0.10 --cap-drop ALL --read-only \
            --restart unless-stopped -v "$data":/data -v "$certs":/certs:ro -v "$site":/site:ro nett-hub:ci \
            serve --data /data --listen 0.0.0.0:8443 --tls-cert /certs/test-cert.pem \
            --tls-key /certs/test-key.pem --releases /site/release.json
          sleep 2
          "$nett" site init
          "$nett" site link "$code"
          for name in box peer; do
            token=$("$nett" site add "$name" --yes | grep -o 'nett_enr_[A-Za-z0-9_-]*')
            ip=172.31.0.11
            [ "$name" = peer ] && ip=172.31.0.12
            docker run -d --name "$name" --network nett-ci --ip "$ip" --cap-add NET_ADMIN --cap-add NET_RAW \
              --restart unless-stopped -e NETT_TOKEN="$token" -v "$name-state":/var/lib/nett nett:ci
          done
          wait_for '[.machines[] | select(.online)] | length == 2'
          # Both stay dial-only and the site has no relay: the Hub sees each at its own address on the
          # network they share, and they connect over it
          "$nett" site allow peer box 8080/tcp --yes
          # The first process and the nett daemon, which holds only NET_ADMIN, NET_RAW and
          # NET_BIND_SERVICE (ADR 0013)
          docker top box | tee top.log
          grep -F 'nett daemon --dir /var/lib/nett' top.log
          if grep -E 'nett (mesh|node|transport)' top.log; then exit 1; fi
          daemon=$(docker top box -eo pid,args | awk '/nett daemon/ { print $1 }')
          grep -E '^CapEff:\s+0+3400$' "/proc/$daemon/status"
          # A service beside box answers each connection with the address it came from
          ask box "perl -MIO::Socket::INET -e '\$s = IO::Socket::INET->new(LocalPort => 8080, Listen => 5, ReuseAddr => 1) or die; while (\$c = \$s->accept) { print \$c \"from \" . \$c->peerhost . \"\n\"; close \$c }'" &
          from=""
          for _ in $(seq 30); do
            from=$(ask peer 'timeout 5 bash -c "exec 3<>/dev/tcp/100.88.0.1/8080; cat <&3"' || true)
            [ -n "$from" ] && break
            sleep 2
          done
          test "$from" = "from 100.88.0.2"
          docker exec peer nett status --json | tee peer-status.json \
            | jq -e '.peers[] | select(.name == "box") | .path.kind == "lan"'
          # 99.0.0: the Hub holds it and nothing moves until it is approved (ADR 0027); then the Hub
          # upgrades itself first, relays it, and the containers move in place
          started=$(docker inspect -f '{{.State.StartedAt}}' box)
          offer 99.0.0 "$out/nett-99.0.0" "$out/nett-hub-99.0.0"
          docker restart hub
          wait_for '.release == "99.0.0"'
          sleep 5
          status '.hub_version != "99.0.0" and ([.machines[] | select(.nett_version == "99.0.0")] | length == 0)'
          "$nett" site status | grep -F '99.0.0 available for the Hub and 2 machines: nett site upgrade'
          "$nett" site upgrade --yes
          wait_for '.hub_version == "99.0.0"'
          docker logs hub 2>&1 | grep -F 'the Hub upgrades itself, as approved, before the machines'
          docker logs hub 2>&1 | grep -F 'upgrade complete'
          wait_for '[.machines[] | select(.online and .nett_version == "99.0.0")] | length == 2'
          test "$(docker inspect -f '{{.State.StartedAt}} {{.RestartCount}}' box)" = "$started 0"
          docker exec box nett status | grep -F 'nett 99.0.0'
          test "$(ask peer 'timeout 5 bash -c "exec 3<>/dev/tcp/100.88.0.1/8080; cat <&3"')" = "from 100.88.0.2"
          # 99.1.0 is signed but does not start (it is the Hub's program): three starts, then back
          offer 99.1.0 "$out/nett-hub-99.0.0"
          docker restart hub
          wait_for '.release == "99.1.0"'
          "$nett" site upgrade --yes
          wait_for '[.machines[] | select(.online and .nett_version == "99.0.0" and ((.upgrade_reason // "") | contains("started 3 times without settling")))] | length == 2'
          docker logs box 2>&1 | grep -F 'rolling back the new version'
          "$nett" site status
      - name: Logs on failure
        if: failure()
        run: |
          for name in hub box peer; do echo "== $name"; docker logs "$name" 2>&1 | tail -60 || true; done

  # Mesh lab scenarios (design/prototype.md section 7), all run on every push. Scenarios do not
  # depend on each other, and are split by duration into groups run in parallel, none much longer
  # than the longest scenario (five minutes of loss on the direct path). One scenario per line:
  # title | arguments for nett-lab run (fixed in this file, not from external input).
  lab:
    name: lab (${{ matrix.title }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: switch
            title: Switchover and relay
            scenarios: |
              Scenario 14: admission verification and direct communication | admission --topology crates/nett-lab/topologies/direct.toml
              Forwarding through the relay (a real WireGuard handshake and data) | relay-smoke --topology crates/nett-lab/topologies/relay-only.toml
              Scenarios 1, 8: direct path fails and switches to the relay, then returns to direct after recovery | failover --topology crates/nett-lab/topologies/failover.toml
              Scenario 2: the current relay fails and switches to another relay | relay-loss --topology crates/nett-lab/topologies/relays.toml
              Scenario 3: restart the current relay without interrupting the connection | relay-restart --topology crates/nett-lab/topologies/relays.toml
              Scenario 26: the current relay's leg to the peer breaks while it still answers, and the pair moves to the other relay | relay-far-leg --topology crates/nett-lab/topologies/far-leg.toml
              Scenarios 7, 9: switch to TLS when all UDP is blocked, then return to direct after recovery | fallback --topology crates/nett-lab/topologies/fallback.toml
              Scenario 16: both sides are dial-only, and after a proposal through the tunnel both ends switch together | dial-only-switch --topology crates/nett-lab/topologies/dial-pair.toml
              Scenario 17: both sides are dial-only, the current relay fails, and they meet by time slice | dial-only-outage --clock-skew 1500 --topology crates/nett-lab/topologies/dial-pair.toml
          - group: relay-choice
            title: A blocked relay port and a faster relay
            scenarios: |
              Scenario 27: the network drops the peer's WireGuard port toward a relay, and the pair stays off that relay | relay-port-block --topology crates/nett-lab/topologies/far-leg.toml
              Scenario 25: a relay much faster than direct takes a quiet pair, and a bulk transfer moves it back | faster-relay --topology crates/nett-lab/topologies/failover.toml
          - group: nat
            title: NAT, hole punching, MTU and access control
            scenarios: |
              Scenario 14: one end is behind a cone NAT | admission --topology crates/nett-lab/topologies/cone-nat.toml
              Scenario 10: cone NAT on both ends, hole punching | punch --topology crates/nett-lab/topologies/punch-cone.toml
              Scenario 11: IPv6 stateful firewall on both ends, hole punching | punch --topology crates/nett-lab/topologies/punch-ipv6.toml
              Scenario 13: symmetric NAT on both ends, no hole punching attempted | punch --topology crates/nett-lab/topologies/punch-symmetric.toml
              Scenario 19: outer path MTU of 1500, 1360, 1300 (IPv4) | mtu --bytes 268435456 --topology crates/nett-lab/topologies/mtu4.toml
              Scenario 19: outer path MTU of 1500, 1360, 1300 (IPv6) | mtu --bytes 268435456 --topology crates/nett-lab/topologies/mtu6.toml
              Access control, Edge address and forwarding to advertised routes (design/local-signing.md section 8) | access --topology crates/nett-lab/topologies/access.toml
              Devices: WireGuard clients reach what their rules allow through a mobile gateway whose FORWARD chain drops (design/devices.md section 10) | devices --topology crates/nett-lab/topologies/devices.toml
              Scenario 31: a served port reaches a loopback service from an allowed member only, never from outside the mesh | serve --topology crates/nett-lab/topologies/serve.toml
              Hub: push, apply, the mesh keeps working when the Hub stops, catch-up after recovery, forged members and old-version rules are rejected (design/hub.md section 10) | hub --topology crates/nett-lab/topologies/direct.toml
          - group: handshake
            title: WireGuard handshake
            scenarios: |
              Scenario 20(a)(b): handshake after removing and re-adding a peer, retry after dropping the first handshake initiation | wg-rehandshake --repeat 3 --topology crates/nett-lab/topologies/relays.toml
              Scenario 20(c): cookie through the relay when the peer is under load | wg-cookie --topology crates/nett-lab/topologies/relays.toml
          - group: rekey
            title: Key rotation and WireGuard port
            scenarios: |
              Scenario 20(b)(d): key rotation (short version, the full 30 minutes runs in acceptance) | wg-rekey --duration 150 --topology crates/nett-lab/topologies/relays.toml
              Scenario 18: probing on the WireGuard port | wgport --topology crates/nett-lab/topologies/wgport.toml
              Scenario 29: a public member's WireGuard port changes while it runs; during an outage the relays forward to the new port, and the pair returns to direct on it | port-change --topology crates/nett-lab/topologies/failover.toml
          - group: loss
            title: Loss on the direct path
            scenarios: |
              Scenario 28: the direct path loses 20% for five minutes, the pair leaves it once and returns when the loss ends | lossy-direct --topology crates/nett-lab/topologies/failover.toml
          - group: load
            title: Congestion and userspace data plane
            scenarios: |
              Scenario 24: congestion (through the relay, short version, the comparison with Tailscale runs in acceptance) | congestion --duration 60 --topology crates/nett-lab/topologies/relay-only.toml
              Scenario 24: congestion (direct, short version) | congestion --duration 60 --topology crates/nett-lab/topologies/fallback.toml
              Userspace data plane interoperating with kernel WireGuard: admission and direct (design/userspace.md section 8) | admission --userspace b --topology crates/nett-lab/topologies/direct.toml
              Userspace data plane: direct path fails and switches to the relay, then returns to direct after recovery | failover --userspace b --topology crates/nett-lab/topologies/failover.toml
              Userspace data plane: cone NAT on both ends, hole punching | punch --userspace b --topology crates/nett-lab/topologies/punch-cone.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        run: rustup toolchain install
      # The dependency cache, as in the rust job
      - name: Dependency key
        id: deps
        run: |
          key=$(awk '/^name = "nett/ { skip = 1; next } skip { skip = 0; next } { print }' Cargo.lock \
            | cat - rust-toolchain.toml | shasum -a 256 | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.key }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Install tools used by the lab network
        timeout-minutes: 10
        run: |
          sudo apt-get -c .github/apt.conf update
          sudo apt-get -c .github/apt.conf install -y --no-install-recommends wireguard-tools nftables iperf3 tcpdump
      - name: Check that kernel WireGuard is available
        run: |
          uname -r
          sudo modprobe wireguard
          sudo ip link add wgcheck type wireguard
          sudo ip link del wgcheck
      - run: cargo build --locked -p nett-cli -p nett-lab -p nett-hub --features nett-cli/lab
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Lab tool self-check (measurement and fault injection)
        run: >-
          sudo ./target/debug/nett-lab run selftest
          --topology crates/nett-lab/topologies/direct.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-selftest"
      - name: Scenario (${{ matrix.title }})
        env:
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          i=0
          # Read from fd 3: the scenario process cannot read, nor consume, the lines that follow
          while IFS='|' read -r -u 3 title args; do
            [ -n "$title" ] || continue
            i=$((i + 1))
            title="${title% }"
            read -ra argv <<< "$args"
            echo "::group::$title"
            if ! sudo ./target/debug/nett-lab run "${argv[@]}" \
                --nett ./target/debug/nett --out "$RUNNER_TEMP/lab-$i"; then
              echo "::endgroup::"
              echo "::error title=lab::$title"
              exit 1
            fi
            echo "::endgroup::"
          done 3<<< "$SCENARIOS"
          test "$i" -gt 0

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-deny (fixed version, hash-verified)
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --max-time 120 -o "$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "${CARGO_DENY_SHA256}  $name.tar.gz" | sha256sum --check -
          tar -xzf "$name.tar.gz" --strip-components=1 -C "$HOME/.cargo/bin" "$name/cargo-deny"
      - run: cargo deny --locked check
