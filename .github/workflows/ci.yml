# 推送到 main 和每个拉取请求时运行：格式、clippy、测试、依赖检查、实验场景（CLAUDE.md "命令"）。
# 第三方 action 固定到提交哈希；下载的工具固定版本并校验哈希。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  # macOS 原生成员（design/userspace.md 第 8 节）：clippy、测试，以及需要 root 的 utun 冒烟测试
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: utun、地址与路由（需要 root）
        run: |
          cargo test --locked -p nett-mesh --lib --no-run
          test_bin=$(cargo test --locked -p nett-mesh --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "nett_mesh") | .executable')
          sudo "$test_bin" --ignored --exact macos::tests::macos_utun_smoke --nocapture
      # design/release.md 第 4 节：站点在默认目录中，install 不带 --config 找到给本机的期望状态
      - name: sudo nett mesh install 的完整流程（需要 root）
        run: |
          cargo build --locked -p nett-cli
          nett="$PWD/target/debug/nett"
          "$nett" site init
          keys=$(sudo "$nett" mesh install | grep '^keys = ')
          printf '[[node]]\nname = "ci"\nreachability = "dial-only"\n%s\n' "$keys" >> ~/.config/nett/site.toml
          "$nett" site build
          sudo "$nett" mesh install | tee install.log
          grep -F "$HOME/.config/nett/nodes/ci/desired.json" install.log
          for _ in $(seq 20); do
            sudo launchctl print system/io.gotry.nett.mesh | grep -q 'state = running' && break
            sleep 0.5
          done
          sudo launchctl print system/io.gotry.nett.mesh | grep 'state = running'
          sudo "$nett" mesh install | grep 'neither the program nor the desired state changed'
          sudo "$nett" mesh uninstall
          ! sudo launchctl print system/io.gotry.nett.mesh 2>/dev/null

  # 组网实验场景（design/prototype.md 第 7 节），每次推送全部跑一遍。场景之间互不依赖，按耗时分成几组并行，
  # 每组约 4 分钟。一行一个场景：标题 | nett-lab run 的参数（本文件写定，不来自外部输入）。
  lab:
    name: lab (${{ matrix.title }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: switch
            title: 切换与中继
            scenarios: |
              场景 14：准入验证与直连通信 | admission --topology crates/nett-lab/topologies/direct.toml
              经中继转发（真实的 WireGuard 握手与数据） | relay-smoke --topology crates/nett-lab/topologies/relay-only.toml
              场景 1、8：直连失效切到中继，恢复后回到直连 | failover --topology crates/nett-lab/topologies/failover.toml
              场景 2：当前中继失效，换到另一个中继 | relay-loss --topology crates/nett-lab/topologies/relays.toml
              场景 3：重启当前中继，连接不中断 | relay-restart --topology crates/nett-lab/topologies/relays.toml
              场景 7、9：UDP 全部被拦时改用 TLS，恢复后回到直连 | fallback --topology crates/nett-lab/topologies/fallback.toml
              场景 16：双方都是 dial-only，经隧道提议后两端一起切换 | dial-only-switch --topology crates/nett-lab/topologies/dial-pair.toml
              场景 17：双方都是 dial-only，当前中继失效，靠时间片汇合 | dial-only-outage --clock-skew 1500 --topology crates/nett-lab/topologies/dial-pair.toml
          - group: nat
            title: NAT、打洞、MTU 与访问控制
            scenarios: |
              场景 14：一端在锥形 NAT 之后 | admission --topology crates/nett-lab/topologies/cone-nat.toml
              场景 10：两端锥形 NAT，打洞 | punch --topology crates/nett-lab/topologies/punch-cone.toml
              场景 11：两端 IPv6 有状态防火墙，打洞 | punch --topology crates/nett-lab/topologies/punch-ipv6.toml
              场景 13：两端对称型 NAT，不尝试打洞 | punch --topology crates/nett-lab/topologies/punch-symmetric.toml
              场景 19：外层路径 MTU 为 1500、1360、1300（IPv4） | mtu --bytes 268435456 --topology crates/nett-lab/topologies/mtu4.toml
              场景 19：外层路径 MTU 为 1500、1360、1300（IPv6） | mtu --bytes 268435456 --topology crates/nett-lab/topologies/mtu6.toml
              访问控制、Edge 专用地址与容器内成员（design/local-signing.md 第 8 节） | access --topology crates/nett-lab/topologies/access.toml
          - group: handshake
            title: WireGuard 握手
            scenarios: |
              场景 20(a)(b)：删除再添加对端后的握手，丢掉第一个握手发起后的重试 | wg-rehandshake --repeat 3 --topology crates/nett-lab/topologies/relays.toml
              场景 20(c)：对端处于负载状态时经中继的 cookie | wg-cookie --topology crates/nett-lab/topologies/relays.toml
          - group: rekey
            title: 密钥轮换与 WireGuard 端口
            scenarios: |
              场景 20(b)(d)：密钥轮换（短版本，完整的 30 分钟在验收中跑） | wg-rekey --duration 150 --topology crates/nett-lab/topologies/relays.toml
              场景 18：在 WireGuard 端口上探测 | wgport --topology crates/nett-lab/topologies/wgport.toml
          - group: load
            title: 拥塞与用户态数据面
            scenarios: |
              场景 24：拥塞（经中继，短版本，与 Tailscale 的对比在验收中跑） | congestion --duration 60 --topology crates/nett-lab/topologies/relay-only.toml
              场景 24：拥塞（直连，短版本） | congestion --duration 60 --topology crates/nett-lab/topologies/fallback.toml
              用户态数据面与内核 WireGuard 互通：准入与直连（design/userspace.md 第 8 节） | admission --userspace b --topology crates/nett-lab/topologies/direct.toml
              用户态数据面：直连失效切到中继，恢复后回到直连 | failover --userspace b --topology crates/nett-lab/topologies/failover.toml
              用户态数据面：两端锥形 NAT，打洞 | punch --userspace b --topology crates/nett-lab/topologies/punch-cone.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 安装实验网络用到的工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wireguard-tools nftables iperf3 tcpdump
      - name: 确认内核 WireGuard 可用
        run: |
          uname -r
          sudo modprobe wireguard
          sudo ip link add wgcheck type wireguard
          sudo ip link del wgcheck
      - run: cargo build --locked -p nett-cli -p nett-lab --features nett-cli/lab
      - name: 实验工具自检（测量与故障注入）
        run: >-
          sudo ./target/debug/nett-lab run selftest
          --topology crates/nett-lab/topologies/direct.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-selftest"
      - name: 场景（${{ matrix.title }}）
        env:
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          i=0
          # 从 fd 3 读：场景进程读不到、也读不走后面的行
          while IFS='|' read -r -u 3 title args; do
            [ -n "$title" ] || continue
            i=$((i + 1))
            title="${title% }"
            read -ra argv <<< "$args"
            echo "::group::$title"
            if ! sudo ./target/debug/nett-lab run "${argv[@]}" \
                --nett ./target/debug/nett --out "$RUNNER_TEMP/lab-$i"; then
              echo "::endgroup::"
              echo "::error title=lab::$title"
              exit 1
            fi
            echo "::endgroup::"
          done 3<<< "$SCENARIOS"
          test "$i" -gt 0

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 安装 cargo-deny（固定版本，校验哈希）
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --max-time 120 -o "$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "${CARGO_DENY_SHA256}  $name.tar.gz" | sha256sum --check -
          tar -xzf "$name.tar.gz" --strip-components=1 -C "$HOME/.cargo/bin" "$name/cargo-deny"
      - run: cargo deny --locked check
