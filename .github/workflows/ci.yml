# Runs on pushes to main and on every pull request: format, clippy, tests, dependency checks, lab
# scenarios (CLAUDE.md "Commands").
# Third-party actions are pinned to commit hashes; downloaded tools are pinned to versions and
# hash-verified.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Hub queries are checked at compile time against the committed .sqlx/: compilation fails when a
  # query changes and the offline data is not updated (CLAUDE.md "API, protocol and database")
  SQLX_OFFLINE: "true"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      # Generated Protobuf types are committed in the repository (CLAUDE.md "API, protocol and
      # database"): regenerate them, and there must be no difference
      - name: Generated Protobuf types are up to date
        run: |
          sudo apt-get -c .github/apt.conf update
          # libprotobuf-dev carries the well-known types (google/protobuf/timestamp.proto)
          sudo apt-get -c .github/apt.conf install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          cargo run --locked -p nett-proto-gen
          git diff --exit-code crates/nett-proto/src/gen
      # Install script for new machines (design/release.md section 6): POSIX sh only
      - run: shellcheck -s sh packaging/install.sh

  # macOS native member (design/userspace.md section 8): clippy, tests, and the utun smoke test that
  # needs root
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: utun, addresses and routes (needs root)
        run: |
          cargo test --locked -p nett-mesh --lib --no-run
          test_bin=$(cargo test --locked -p nett-mesh --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "nett_mesh") | .executable')
          sudo "$test_bin" --ignored --exact macos::tests::macos_utun_smoke --nocapture
      # design/release.md section 4: the site is in the default directory, and install without
      # --config finds the desired state for this machine
      - name: Full flow of sudo nett install (needs root)
        run: |
          cargo build --locked -p nett-cli
          nett="$PWD/target/debug/nett"
          "$nett" site init
          keys=$(sudo "$nett" install | sed -n 's/^  nett site add <name> --keys "\(.*\)"$/\1/p')
          test -n "$keys"
          "$nett" site add ci --keys "$keys" --yes
          sudo "$nett" install | tee install.log
          grep -F "$HOME/.config/nett/nodes/ci/desired.json" install.log
          for _ in $(seq 20); do
            sudo launchctl print system/io.gotry.nett.mesh | grep -q 'state = running' && break
            sleep 0.5
          done
          sudo launchctl print system/io.gotry.nett.mesh | grep 'state = running'
          # Local status (design/status.md): readable by root, and ordinary users get a hint
          for _ in $(seq 20); do
            sudo test -S /var/run/nett/mesh.sock && break
            sleep 0.5
          done
          sudo "$nett" status | tee status.log
          grep -F 'No peers.' status.log
          # Names (design/names-and-diagnostics.md section 3): this machine's own name, from its
          # responder and through the system resolver
          v4=$(sed -n 's/^mesh  *\([0-9.]*\),.*/\1/p' status.log)
          test -n "$v4"
          for _ in $(seq 20); do
            [ "$(dig +short +time=1 +tries=1 @"$v4" ci.nett.internal)" = "$v4" ] && break
            sleep 0.5
          done
          [ "$(dig +short +time=1 +tries=1 @"$v4" ci.nett.internal)" = "$v4" ]
          dscacheutil -q host -a name ci.nett.internal | grep -F "$v4"
          ! "$nett" status 2> status.err
          grep -F 'run with sudo' status.err
          sudo "$nett" install | grep -F 'The services are running. Nothing changed.'
          # The desired state changed (same content, different bytes): reload over the local
          # interface and report the result
          python3 -m json.tool ~/.config/nett/nodes/ci/desired.json > reformatted.json
          sudo "$nett" install --config reformatted.json | grep -F 'Reloaded the desired state.'
          sudo "$nett" reload | grep -F 'Reloaded the desired state.'
          sudo "$nett" uninstall
          ! sudo launchctl print system/io.gotry.nett.mesh 2>/dev/null
      # design/hub.md sections 3.5, 7: an existing member joins the Hub. The Hub terminates TLS
      # locally with a test certificate, verified by fingerprint
      - name: sudo nett install <token> (join the Hub, needs root)
        run: |
          cargo build --locked -p nett-cli -p nett-hub
          nett="$PWD/target/debug/nett"
          hub="$PWD/target/debug/nett-hub"
          certs=crates/nett-hub/tests/data
          data="$RUNNER_TEMP/hub"
          code=$("$hub" init --data "$data" --url https://127.0.0.1:8443 --tls-cert "$certs/test-cert.pem" \
            | grep -o 'nett_lnk_[A-Za-z0-9_-]*')
          "$hub" serve --data "$data" --listen 127.0.0.1:8443 --releases off \
            --tls-cert "$certs/test-cert.pem" --tls-key "$certs/test-key.pem" 2> hub.log &
          for _ in $(seq 20); do grep -q 'Hub listening' hub.log && break; sleep 0.5; done
          "$nett" site link "$code" | grep -F 'Linked to https://127.0.0.1:8443'
          token=$("$nett" site invite ci | grep -o 'nett_enr_[A-Za-z0-9_-]*')
          sudo "$nett" install "$token" | tee join.log
          grep -F 'Connecting this machine to the Hub at https://127.0.0.1:8443' join.log
          for _ in $(seq 40); do
            "$nett" site status --json \
              | jq -e '.machines[] | select(.name == "ci") | .online and .result == "applied"' && break
            sleep 0.5
          done
          "$nett" site status | tee site-status.log
          grep -E '^ci +100\.88\.[0-9.]+ +online +[0-9.]+ +current' site-status.log
          sudo launchctl print system/io.gotry.nett.node | grep 'state = running'
          # On a machine joined to the Hub, the desired state is written only by nett-node
          ! sudo "$nett" install --config ~/.config/nett/nodes/ci/desired.json
          sudo "$nett" uninstall
          ! sudo launchctl print system/io.gotry.nett.node 2>/dev/null
          # After leaving, the same Mac joins via the Hub as a new machine (design/hub.md sections
          # 3.3, 6), then leaves again
          sudo "$nett" leave | tee leave.log
          grep -F 'Told the Hub at https://127.0.0.1:8443' leave.log
          "$nett" site add ci-new --yes | tee add.log
          grep -F -- '- ci left the site' add.log
          token=$(grep -o 'nett_enr_[A-Za-z0-9_-]*' add.log)
          sudo "$nett" install "$token" | tee enroll.log
          grep -F 'Joining the site through the Hub at https://127.0.0.1:8443' enroll.log
          for _ in $(seq 40); do
            "$nett" site status --json \
              | jq -e '.machines[] | select(.name == "ci-new") | .online and .result == "applied"' && break
            sleep 0.5
          done
          "$nett" site status | tee site-status.log
          grep -E '^ci-new +100\.88\.[0-9.]+ +online +[0-9.]+ +current' site-status.log
          # A token can be used only once
          ! sudo "$nett" install "$token"
          sudo "$nett" leave
          ! sudo launchctl print system/io.gotry.nett.mesh 2>/dev/null


  # Linux with real systemd (design/hub.md section 7, design/release.md section 7): a new machine
  # joins through the Hub with `sudo nett install <token>`, upgrades itself to a newer release that
  # a local website serves (signed with a key generated for this test and built into both
  # versions), and leaves again
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # The same pinned minisign as the release workflow
      MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        run: rustup toolchain install
      # Release key rotation (design/auth.md section 11.3): this version trusts an old primary and
      # backup key; 99.0.0, signed by the old backup key, carries a new pair
      - name: Release keys for this test
        run: |
          curl -fsSL -o minisign.tar.gz "$MINISIGN_URL"
          echo "$MINISIGN_SHA256  minisign.tar.gz" | sha256sum -c -
          tar -xzf minisign.tar.gz minisign-linux/x86_64/minisign
          for key in old-primary old-backup new-primary new-backup; do
            minisign-linux/x86_64/minisign -G -W -p "$RUNNER_TEMP/$key.pub" -s "$RUNNER_TEMP/$key.key"
          done
      - name: Build this version with the old keys, and 99.0.0 and 99.2.0 with the new ones
        run: |
          NETT_RELEASE_PUBLIC_KEYS="$(cat "$RUNNER_TEMP/old-primary.pub" "$RUNNER_TEMP/old-backup.pub")" \
            cargo build --locked -p nett-cli -p nett-hub
          export NETT_RELEASE_PUBLIC_KEYS="$(cat "$RUNNER_TEMP/new-primary.pub" "$RUNNER_TEMP/new-backup.pub")"
          next="$RUNNER_TEMP/next"
          mkdir -p "$next" "$RUNNER_TEMP/site/dl"
          tar --exclude=./target --exclude=./.git -cf - . | tar -xf - -C "$next"
          for version in 99.0.0 99.2.0; do
            sed -i "0,/^version = \".*\"/s//version = \"$version\"/" "$next/Cargo.toml"
            # A release build, like the programs nodes download (a debug build exceeds the size limit)
            (cd "$next" && cargo update --workspace --offline && CARGO_TARGET_DIR="$PWD/../next-target" cargo build --release -p nett-cli)
            cp "$RUNNER_TEMP/next-target/release/nett" "$RUNNER_TEMP/site/dl/nett-$version-x86_64-unknown-linux-musl"
          done
          # 99.1.0 is only ever rejected: the 99.0.0 program under its name is enough
          cp "$RUNNER_TEMP/site/dl/nett-99.0.0-x86_64-unknown-linux-musl" "$RUNNER_TEMP/site/dl/nett-99.1.0-x86_64-unknown-linux-musl"
          cat > "$RUNNER_TEMP/offer.sh" <<'SH'
          # offer.sh <version> <key>: sign that program with that key and make it the release the Hub relays
          set -eu
          site="$RUNNER_TEMP/site" program="nett-$1-x86_64-unknown-linux-musl"
          rm -f "$site/dl/$program.minisig"
          minisign-linux/x86_64/minisign -S -s "$RUNNER_TEMP/$2.key" -m "$site/dl/$program" -t "nett v$1 $program"
          jq -n --arg v "$1" --arg sha "$(sha256sum "$site/dl/$program" | cut -d' ' -f1)" --rawfile sig "$site/dl/$program.minisig" \
            '{version: $v, programs: {"x86_64-unknown-linux-musl": {url: ("https://127.0.0.1:8444/dl/nett-" + $v + "-x86_64-unknown-linux-musl"), sha256: $sha, minisig: $sig}}}' \
            > "$site/release.json"
          SH
      - name: Serve the newer release over HTTPS
        run: |
          site="$RUNNER_TEMP/site"
          sh "$RUNNER_TEMP/offer.sh" 99.0.0 old-backup
          # A throwaway CA, trusted system-wide for this run only, and a certificate for 127.0.0.1
          tls="$RUNNER_TEMP/tls"
          mkdir -p "$tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj /CN=nett-test-ca -keyout "$tls/ca.key" -out "$tls/ca.pem"
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=127.0.0.1 \
            -keyout "$tls/site.key" -out "$tls/site.csr"
          printf 'subjectAltName=IP:127.0.0.1\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' \
            > "$tls/site.ext"
          openssl x509 -req -in "$tls/site.csr" -CA "$tls/ca.pem" -CAkey "$tls/ca.key" -CAcreateserial \
            -days 1 -extfile "$tls/site.ext" -out "$tls/site.pem"
          sudo cp "$tls/ca.pem" /usr/local/share/ca-certificates/nett-test.crt
          sudo update-ca-certificates
          cat > "$RUNNER_TEMP/serve.py" <<'PY'
          import functools, http.server, ssl, sys
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=sys.argv[1])
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 8444), handler)
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain(sys.argv[2], sys.argv[3])
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PY
          python3 "$RUNNER_TEMP/serve.py" "$site" "$tls/site.pem" "$tls/site.key" 2> site.log &
          for _ in $(seq 20); do curl -fsS https://127.0.0.1:8444/release.json > /dev/null && break; sleep 0.5; done
      - name: Join through the Hub, upgrade, rotate the release keys, leave (needs root)
        run: |
          nett="$PWD/target/debug/nett"
          hub="$PWD/target/debug/nett-hub"
          certs=crates/nett-hub/tests/data
          data="$RUNNER_TEMP/hub"
          code=$("$hub" init --data "$data" --url https://127.0.0.1:8443 --tls-cert "$certs/test-cert.pem" \
            | grep -o 'nett_lnk_[A-Za-z0-9_-]*')
          # The Hub fetches the release manifest when it starts: restarting it relays a new one
          serve_hub() {
            started=$(grep -c 'Hub listening' hub.log 2>/dev/null || true)
            "$hub" serve --data "$data" --listen 127.0.0.1:8443 --tls-cert "$certs/test-cert.pem" \
              --tls-key "$certs/test-key.pem" --releases https://127.0.0.1:8444/release.json 2>> hub.log &
            hub_pid=$!
            for _ in $(seq 20); do
              [ "$(grep -c 'Hub listening' hub.log)" -gt "${started:-0}" ] && break
              sleep 0.5
            done
          }
          serve_hub
          "$nett" site init
          "$nett" site link "$code" | grep -F 'Linked to https://127.0.0.1:8443'
          "$nett" site add ci --yes | tee add.log
          token=$(grep -o 'nett_enr_[A-Za-z0-9_-]*' add.log)
          sudo "$nett" install "$token" | tee install.log
          grep -F 'Joining the site through the Hub at https://127.0.0.1:8443' install.log
          test "$(readlink /usr/local/bin/nett)" = /usr/local/lib/nett/nett
          systemctl is-active --quiet nett-mesh.service
          # The desired state is readable by the mesh service's group only
          test "$(sudo stat -c '%a %G' /etc/nett/desired.json)" = "640 nett"
          test "$(sudo stat -c '%a %G' /etc/nett)" = "2750 nett"
          # The Hub offers 99.0.0, signed by the old backup key: nett-node verifies it, installs it,
          # restarts the mesh service and itself
          wait_for() {
            for _ in $(seq 120); do
              "$nett" site status --json | jq -e ".machines[] | select(.name == \"ci\") | $1" && return 0
              sleep 1
            done
            "$nett" site status --json | jq '.machines[] | select(.name == "ci")'
            return 1
          }
          wait_for '.online and .nett_version == "99.0.0"'
          "$nett" site status | tee site-status.log
          grep -E '^ci +100\.88\.[0-9.]+ +online +99\.0\.0 ' site-status.log
          test -f /usr/local/lib/nett/nett.previous
          systemctl is-active --quiet nett-mesh.service nett-node.service
          # 99.0.0 trusts only the new keys: 99.1.0 signed by the old primary key is refused
          sh "$RUNNER_TEMP/offer.sh" 99.1.0 old-primary
          kill "$hub_pid"; wait "$hub_pid" || true
          serve_hub
          wait_for '.upgrade_result == "rejected" and (.upgrade_reason | contains("does not trust"))'
          wait_for '.online and .nett_version == "99.0.0"'
          # ... and 99.2.0 signed by the new primary key is installed
          sh "$RUNNER_TEMP/offer.sh" 99.2.0 new-primary
          kill "$hub_pid"; wait "$hub_pid" || true
          serve_hub
          wait_for '.online and .nett_version == "99.2.0"'
          sudo journalctl -u nett-node --no-pager | tail -20
          sudo nett leave | tee leave.log
          grep -F 'Told the Hub at https://127.0.0.1:8443' leave.log
          ! systemctl is-active --quiet nett-mesh.service
          ! ip link show nett0 2>/dev/null
          test ! -e /etc/nett/identity.key
      - name: Logs on failure
        if: failure()
        run: |
          cat hub.log site.log || true
          sudo journalctl -u nett-mesh -u nett-node --no-pager | tail -80 || true

  # Mesh lab scenarios (design/prototype.md section 7), all run on every push. Scenarios do not
  # depend on each other, and are split by duration into groups run in parallel,
  # about 4 minutes each. One scenario per line: title | arguments for nett-lab run (fixed in this
  # file, not from external input).
  lab:
    name: lab (${{ matrix.title }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: switch
            title: Switchover and relay
            scenarios: |
              Scenario 14: admission verification and direct communication | admission --topology crates/nett-lab/topologies/direct.toml
              Forwarding through the relay (a real WireGuard handshake and data) | relay-smoke --topology crates/nett-lab/topologies/relay-only.toml
              Scenarios 1, 8: direct path fails and switches to the relay, then returns to direct after recovery | failover --topology crates/nett-lab/topologies/failover.toml
              Scenario 2: the current relay fails and switches to another relay | relay-loss --topology crates/nett-lab/topologies/relays.toml
              Scenario 3: restart the current relay without interrupting the connection | relay-restart --topology crates/nett-lab/topologies/relays.toml
              Scenario 25: a relay much faster than direct takes a quiet pair, and a bulk transfer moves it back | faster-relay --topology crates/nett-lab/topologies/failover.toml
              Scenarios 7, 9: switch to TLS when all UDP is blocked, then return to direct after recovery | fallback --topology crates/nett-lab/topologies/fallback.toml
              Scenario 16: both sides are dial-only, and after a proposal through the tunnel both ends switch together | dial-only-switch --topology crates/nett-lab/topologies/dial-pair.toml
              Scenario 17: both sides are dial-only, the current relay fails, and they meet by time slice | dial-only-outage --clock-skew 1500 --topology crates/nett-lab/topologies/dial-pair.toml
          - group: nat
            title: NAT, hole punching, MTU and access control
            scenarios: |
              Scenario 14: one end is behind a cone NAT | admission --topology crates/nett-lab/topologies/cone-nat.toml
              Scenario 10: cone NAT on both ends, hole punching | punch --topology crates/nett-lab/topologies/punch-cone.toml
              Scenario 11: IPv6 stateful firewall on both ends, hole punching | punch --topology crates/nett-lab/topologies/punch-ipv6.toml
              Scenario 13: symmetric NAT on both ends, no hole punching attempted | punch --topology crates/nett-lab/topologies/punch-symmetric.toml
              Scenario 19: outer path MTU of 1500, 1360, 1300 (IPv4) | mtu --bytes 268435456 --topology crates/nett-lab/topologies/mtu4.toml
              Scenario 19: outer path MTU of 1500, 1360, 1300 (IPv6) | mtu --bytes 268435456 --topology crates/nett-lab/topologies/mtu6.toml
              Access control, Edge address and container members (design/local-signing.md section 8) | access --topology crates/nett-lab/topologies/access.toml
              Hub: push, apply, the mesh keeps working when the Hub stops, catch-up after recovery, forged members and old-version rules are rejected (design/hub.md section 10) | hub --topology crates/nett-lab/topologies/direct.toml
          - group: handshake
            title: WireGuard handshake
            scenarios: |
              Scenario 20(a)(b): handshake after removing and re-adding a peer, retry after dropping the first handshake initiation | wg-rehandshake --repeat 3 --topology crates/nett-lab/topologies/relays.toml
              Scenario 20(c): cookie through the relay when the peer is under load | wg-cookie --topology crates/nett-lab/topologies/relays.toml
          - group: rekey
            title: Key rotation and WireGuard port
            scenarios: |
              Scenario 20(b)(d): key rotation (short version, the full 30 minutes runs in acceptance) | wg-rekey --duration 150 --topology crates/nett-lab/topologies/relays.toml
              Scenario 18: probing on the WireGuard port | wgport --topology crates/nett-lab/topologies/wgport.toml
          - group: load
            title: Congestion and userspace data plane
            scenarios: |
              Scenario 24: congestion (through the relay, short version, the comparison with Tailscale runs in acceptance) | congestion --duration 60 --topology crates/nett-lab/topologies/relay-only.toml
              Scenario 24: congestion (direct, short version) | congestion --duration 60 --topology crates/nett-lab/topologies/fallback.toml
              Userspace data plane interoperating with kernel WireGuard: admission and direct (design/userspace.md section 8) | admission --userspace b --topology crates/nett-lab/topologies/direct.toml
              Userspace data plane: direct path fails and switches to the relay, then returns to direct after recovery | failover --userspace b --topology crates/nett-lab/topologies/failover.toml
              Userspace data plane: cone NAT on both ends, hole punching | punch --userspace b --topology crates/nett-lab/topologies/punch-cone.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        run: rustup toolchain install
      - name: Install tools used by the lab network
        timeout-minutes: 10
        run: |
          sudo apt-get -c .github/apt.conf update
          sudo apt-get -c .github/apt.conf install -y --no-install-recommends wireguard-tools nftables iperf3 tcpdump
      - name: Check that kernel WireGuard is available
        run: |
          uname -r
          sudo modprobe wireguard
          sudo ip link add wgcheck type wireguard
          sudo ip link del wgcheck
      - run: cargo build --locked -p nett-cli -p nett-lab -p nett-hub --features nett-cli/lab
      - name: Lab tool self-check (measurement and fault injection)
        run: >-
          sudo ./target/debug/nett-lab run selftest
          --topology crates/nett-lab/topologies/direct.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-selftest"
      - name: Scenario (${{ matrix.title }})
        env:
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          i=0
          # Read from fd 3: the scenario process cannot read, nor consume, the lines that follow
          while IFS='|' read -r -u 3 title args; do
            [ -n "$title" ] || continue
            i=$((i + 1))
            title="${title% }"
            read -ra argv <<< "$args"
            echo "::group::$title"
            if ! sudo ./target/debug/nett-lab run "${argv[@]}" \
                --nett ./target/debug/nett --out "$RUNNER_TEMP/lab-$i"; then
              echo "::endgroup::"
              echo "::error title=lab::$title"
              exit 1
            fi
            echo "::endgroup::"
          done 3<<< "$SCENARIOS"
          test "$i" -gt 0

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain specified by rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-deny (fixed version, hash-verified)
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --max-time 120 -o "$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "${CARGO_DENY_SHA256}  $name.tar.gz" | sha256sum --check -
          tar -xzf "$name.tar.gz" --strip-components=1 -C "$HOME/.cargo/bin" "$name/cargo-deny"
      - run: cargo deny --locked check
