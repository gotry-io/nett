# 推送到 main 和每个拉取请求时运行：格式、clippy、测试、依赖检查、实验场景（CLAUDE.md "命令"）。
# 第三方 action 固定到提交哈希；下载的工具固定版本并校验哈希。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  # 实验环境 A 的短场景，每次推送各跑一次 nett（design/prototype.md 第 7 节）
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 安装实验网络用到的工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wireguard-tools nftables iperf3 tcpdump
      - name: 确认内核 WireGuard 可用
        run: |
          uname -r
          sudo modprobe wireguard
          sudo ip link add wgcheck type wireguard
          sudo ip link del wgcheck
      - run: cargo build --locked -p nett-cli -p nett-lab --features nett-cli/lab
      - name: 实验工具自检（测量与故障注入）
        run: >-
          sudo ./target/debug/nett-lab run selftest
          --topology crates/nett-lab/topologies/direct.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-selftest"
      - name: 场景 14：准入验证与直连通信
        run: >-
          sudo ./target/debug/nett-lab run admission
          --topology crates/nett-lab/topologies/direct.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-14"
      - name: 经中继转发（真实的 WireGuard 握手与数据）
        run: >-
          sudo ./target/debug/nett-lab run relay-smoke
          --topology crates/nett-lab/topologies/relay-only.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-relay"
      - name: 场景 1、8：直连失效切到中继，恢复后回到直连
        run: >-
          sudo ./target/debug/nett-lab run failover
          --topology crates/nett-lab/topologies/failover.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-failover"
      - name: 场景 2：当前中继失效，换到另一个中继
        run: >-
          sudo ./target/debug/nett-lab run relay-loss
          --topology crates/nett-lab/topologies/relays.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-relay-loss"
      - name: 场景 3：重启当前中继，连接不中断
        run: >-
          sudo ./target/debug/nett-lab run relay-restart
          --topology crates/nett-lab/topologies/relays.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-relay-restart"
      - name: 场景 18：在 WireGuard 端口上探测
        run: >-
          sudo ./target/debug/nett-lab run wgport
          --topology crates/nett-lab/topologies/wgport.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-wgport"
      - name: 场景 14：一端在锥形 NAT 之后
        run: >-
          sudo ./target/debug/nett-lab run admission
          --topology crates/nett-lab/topologies/cone-nat.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-14-nat"
      - name: 场景 7、9：UDP 全部被拦时改用 TLS，恢复后回到直连
        run: >-
          sudo ./target/debug/nett-lab run fallback
          --topology crates/nett-lab/topologies/fallback.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-fallback"
      - name: 场景 10：两端锥形 NAT，打洞
        run: >-
          sudo ./target/debug/nett-lab run punch
          --topology crates/nett-lab/topologies/punch-cone.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-punch-cone"
      - name: 场景 11：两端 IPv6 有状态防火墙，打洞
        run: >-
          sudo ./target/debug/nett-lab run punch
          --topology crates/nett-lab/topologies/punch-ipv6.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-punch-ipv6"
      - name: 场景 13：两端对称型 NAT，不尝试打洞
        run: >-
          sudo ./target/debug/nett-lab run punch
          --topology crates/nett-lab/topologies/punch-symmetric.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-punch-symmetric"
      - name: 场景 16：双方都是 dial-only，经隧道提议后两端一起切换
        run: >-
          sudo ./target/debug/nett-lab run dial-only-switch
          --topology crates/nett-lab/topologies/dial-pair.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-16"
      - name: 场景 17：双方都是 dial-only，当前中继失效，靠时间片汇合
        run: >-
          sudo ./target/debug/nett-lab run dial-only-outage
          --clock-skew 1500
          --topology crates/nett-lab/topologies/dial-pair.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-17"
      - name: 场景 19：外层路径 MTU 为 1500、1360、1300（IPv4）
        run: >-
          sudo ./target/debug/nett-lab run mtu
          --bytes 268435456
          --topology crates/nett-lab/topologies/mtu4.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-19-v4"
      - name: 场景 19：外层路径 MTU 为 1500、1360、1300（IPv6）
        run: >-
          sudo ./target/debug/nett-lab run mtu
          --bytes 268435456
          --topology crates/nett-lab/topologies/mtu6.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-19-v6"
      - name: 场景 20(a)(b)：删除再添加对端后的握手，丢掉第一个握手发起后的重试
        run: >-
          sudo ./target/debug/nett-lab run wg-rehandshake
          --repeat 3
          --topology crates/nett-lab/topologies/relays.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-20ab"
      - name: 场景 20(c)：对端处于负载状态时经中继的 cookie
        run: >-
          sudo ./target/debug/nett-lab run wg-cookie
          --topology crates/nett-lab/topologies/relays.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-20c"
      - name: 场景 20(b)(d)：密钥轮换（短版本，完整的 30 分钟在验收中跑）
        run: >-
          sudo ./target/debug/nett-lab run wg-rekey
          --duration 150
          --topology crates/nett-lab/topologies/relays.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-20bd"
      - name: 场景 24：拥塞（经中继，短版本，与 Tailscale 的对比在验收中跑）
        run: >-
          sudo ./target/debug/nett-lab run congestion
          --duration 60
          --topology crates/nett-lab/topologies/relay-only.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-24-relay"
      - name: 场景 24：拥塞（直连，短版本）
        run: >-
          sudo ./target/debug/nett-lab run congestion
          --duration 60
          --topology crates/nett-lab/topologies/fallback.toml
          --nett ./target/debug/nett
          --out "$RUNNER_TEMP/lab-24-direct"

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 安装 cargo-deny（固定版本，校验哈希）
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --max-time 120 -o "$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "${CARGO_DENY_SHA256}  $name.tar.gz" | sha256sum --check -
          tar -xzf "$name.tar.gz" --strip-components=1 -C "$HOME/.cargo/bin" "$name/cargo-deny"
      - run: cargo deny --locked check
