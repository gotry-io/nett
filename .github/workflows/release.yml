# Releases when a v* tag is pushed (design/release.md section 3, ADR 0020): builds nett for each
# platform, signs with the primary key in the release environment,
# publishes the GitHub Release, and updates the formula in gotry-io/homebrew-tap. v* tags are
# protected by a ruleset, and the primary private key is visible only to them.
# Third-party actions are pinned to commit hashes; downloaded tools are pinned to versions and
# hash-verified.

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # minisign 0.12, checked against the author's public key
  # (RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3)
  MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
  MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15, target: x86_64-apple-darwin }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain and targets specified by rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Tag matches the workspace version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "nett-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: musl toolchain
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -c .github/apt.conf update
          sudo apt-get -c .github/apt.conf install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p nett-cli
      # The Hub runs only on Linux hosts (design/hub.md section 8)
      - if: runner.os == 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }} -p nett-hub
      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/nett-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" nett \
            -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE
          # The bare program, which nodes download when they upgrade themselves (design/release.md section 7)
          cp "target/${{ matrix.target }}/release/nett" "dist/nett-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          if [ "$RUNNER_OS" = Linux ]; then
            tar -czf "dist/nett-hub-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz" \
              -C "target/${{ matrix.target }}/release" nett-hub \
              -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Receives only the archives produced by the build: no checkout, no other dependencies installed,
  # so the build job cannot get the private key
  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Pinned-version minisign
        run: |
          curl -fsSL -o minisign.tar.gz "$MINISIGN_URL"
          echo "$MINISIGN_SHA256  minisign.tar.gz" | sha256sum -c -
          tar -xzf minisign.tar.gz minisign-linux/x86_64/minisign
      - name: Sign
        env:
          NETT_RELEASE_PRIMARY_KEY: ${{ secrets.NETT_RELEASE_PRIMARY_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release.key"
          printf '%s\n' "$NETT_RELEASE_PRIMARY_KEY" > "$key"
          minisign="$PWD/minisign-linux/x86_64/minisign"
          cd dist
          sha256sum -- nett-* > SHA256SUMS
          for f in nett-* SHA256SUMS; do
            "$minisign" -S -s "$key" -m "$f" -t "nett $GITHUB_REF_NAME $f"
          done
          rm -f "$key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Verify the signature with the public key in the repository
        run: |
          curl -fsSL -o minisign.tar.gz "$MINISIGN_URL"
          echo "$MINISIGN_SHA256  minisign.tar.gz" | sha256sum -c -
          tar -xzf minisign.tar.gz minisign-linux/x86_64/minisign
          for f in dist/nett-* dist/SHA256SUMS; do
            case "$f" in *.minisig) continue ;; esac
            minisign-linux/x86_64/minisign -V -p keys/nett-release-primary.pub -m "$f"
          done
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Release notes come from this version's section in CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [$version]" 'index($0, v) == 1 { on = 1; next } /^## \[/ { on = 0 } on' \
            CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "nett ${GITHUB_REF_NAME#v}" --notes-file notes.md

  tap:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gotry-io/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap
      - name: Generate the formula from the template and push it
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha() { awk -v f="nett-$version-$1.tar.gz" '$2 == f { print $1 }' dist/SHA256SUMS; }
          arm=$(sha aarch64-apple-darwin)
          intel=$(sha x86_64-apple-darwin)
          test -n "$arm" && test -n "$intel"
          sed -e "s/@VERSION@/$version/g" -e "s/@SHA256_AARCH64@/$arm/" -e "s/@SHA256_X86_64@/$intel/" \
            packaging/homebrew/nett.rb > tap/Formula/nett.rb
          cd tap
          git config user.name "nett release"
          git config user.email "release@nett.gotry.io"
          git add Formula/nett.rb
          git commit -m "nett $version"
          git push

  # Project website nett.gotry.io (design/release.md section 6): the home page, the install script
  # with version and hash filled in, and this version's archives.
  # A new machine trusts this website on first install; the deployment key, like the signing key, is
  # available only in an environment restricted to v* tags
  site:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: site
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Generate the website from the template
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum -c SHA256SUMS)
          sum() { awk -v f="$1" '$2 == f { print $1 }' dist/SHA256SUMS; }
          sha() { sum "nett-$version-$1.tar.gz"; }
          mkdir -p site/dl
          programs='{}'
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            program="nett-$version-$target"
            test -n "$(sha "$target")" && test -n "$(sum "$program")"
            cp "dist/$program.tar.gz" "dist/$program" site/dl/
            programs=$(jq --arg t "$target" --arg url "https://nett.gotry.io/dl/$program" \
              --arg sha "$(sum "$program")" --rawfile sig "dist/$program.minisig" \
              '. + {($t): {url: $url, sha256: $sha, minisig: $sig}}' <<< "$programs")
          done
          # The release manifest nodes upgrade from (design/release.md section 7)
          jq -n --arg v "$version" --argjson programs "$programs" '{version: $v, programs: $programs}' \
            > site/release.json
          sed -e "s/@VERSION@/$version/" \
            -e "s/@SHA256_X86_64_LINUX@/$(sha x86_64-unknown-linux-musl)/" \
            -e "s/@SHA256_AARCH64_LINUX@/$(sha aarch64-unknown-linux-musl)/" \
            -e "s/@SHA256_X86_64_DARWIN@/$(sha x86_64-apple-darwin)/" \
            -e "s/@SHA256_AARCH64_DARWIN@/$(sha aarch64-apple-darwin)/" \
            packaging/install.sh > site/install.sh
          ! grep -q '@[A-Z0-9_]*@' site/install.sh
          cp packaging/site/index.html site/index.html
      - name: Deploy to Cloudflare (static-files-only Worker, packaging/site/wrangler.jsonc)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 deploy --config packaging/site/wrangler.jsonc
