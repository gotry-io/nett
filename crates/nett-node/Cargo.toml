[package]
name = "nett-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The control agent on each machine (design/hub.md section 5): connects to the Hub, hands the
# desired state to the mesh process, and reports status. It listens on no port, executes no shell
# and does not access Docker (hard rules 1, 2, 9). It also provides the HTTPS client the signing
# tool uses to call the Hub API

[lints]
workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
nett-core.workspace = true
nett-mesh.workspace = true
nett-proto.workspace = true
nett-transport.workspace = true
# At enrollment, signs the admission proof with the enrollment private key from the token
# (design/hub.md section 6)
nett-trust = { workspace = true, features = ["signing"] }
prost.workspace = true
prost-types.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
x25519-dalek.workspace = true

[dev-dependencies]
nett-site.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
