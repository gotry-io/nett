[package]
name = "nett-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# 每台机器上的控制代理（design/hub.md 第 5 节）：连接 Hub，把期望状态交给组网进程，上报状态。不监听端口，
# 不执行 shell，不访问 Docker（硬性规则 1、2、9）。也提供签名工具调用 Hub API 的 HTTPS 客户端

[lints]
workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
nett-core.workspace = true
nett-mesh.workspace = true
nett-proto.workspace = true
nett-transport.workspace = true
# 入网时用 token 中的入网私钥签准入证明（design/hub.md 第 6 节）
nett-trust = { workspace = true, features = ["signing"] }
prost.workspace = true
prost-types.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
x25519-dalek.workspace = true

[dev-dependencies]
nett-site.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
