[package]
name = "nett-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nett"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
lexopt.workspace = true
# The signing tool `nett site` (design/local-signing.md) runs on the user's computer, on every
# platform
nett-core.workspace = true
nett-mesh.workspace = true
nett-site.workspace = true
# The API client between the signing tool and the Hub, and nett-node on each machine (design/hub.md)
nett-node.workspace = true
nett-proto.workspace = true
base64.workspace = true
nett-trust = { workspace = true, features = ["signing"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Mesh process: Linux, and the macOS native member (design/userspace.md)
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tokio = { workspace = true, features = ["rt", "signal", "macros", "net", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
x25519-dalek.workspace = true

# libc is already in the dependency tree (nett-mesh uses it): opens the desired state file without
# following symlinks and without blocking; confirms that the process runs as root when installing
# the service; on macOS, looks up the home directory of the user who ran sudo by SUDO_UID
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
# The relay and the transport adapter run on Linux (design/mesh.md sections 5.2 and 5.3)
nett-relay.workspace = true
nett-transport.workspace = true
rustix = { workspace = true, features = ["thread", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process"] }

[features]
# Lab build: lab options of the mesh process (event file, simulated clock skew, transport adapter
# configuration file), and the relay reading its assignment from a file (design/prototype.md
# sections 3 and 7); not enabled in official builds
lab = ["nett-mesh/lab", "nett-relay/lab"]
