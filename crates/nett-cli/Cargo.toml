[package]
name = "nett-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nett"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
lexopt.workspace = true
nett-core = { workspace = true, optional = true }
nett-mesh = { workspace = true, optional = true }
nett-relay = { workspace = true, optional = true }
nett-transport = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "signal", "macros", "net"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["thread"] }

[features]
# 实验构建：`nett mesh` 从本地文件读取期望状态（design/prototype.md 第 3 节），官方构建不开启
lab = [
    "dep:nett-core",
    "dep:nett-mesh",
    "nett-mesh/lab",
    "dep:nett-relay",
    "nett-relay/lab",
    "dep:nett-transport",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
]
