[package]
name = "nett-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nett"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
lexopt.workspace = true
# 签名工具 `nett site`（design/local-signing.md）在用户的电脑上运行，各平台都有
nett-core.workspace = true
nett-mesh.workspace = true
nett-trust = { workspace = true, features = ["signing"] }
ring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
zeroize.workspace = true
nett-relay = { workspace = true, optional = true }
nett-transport = { workspace = true, optional = true }

# 组网进程：Linux，以及 macOS 原生成员（design/userspace.md）
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tokio = { workspace = true, features = ["rt", "signal", "macros", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# libc 已在依赖树中（nett-mesh 用它）：以不跟随符号链接、非阻塞的方式打开期望状态文件；macOS 上安装组网
# 服务时确认以 root 运行，按 SUDO_UID 查运行 sudo 的用户的家目录
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process"] }

[features]
# 实验构建：组网进程的实验选项（事件文件、模拟时钟误差、传输适配进程的配置），以及中继和传输适配进程
# （design/prototype.md 第 3、7 节），官方构建不开启
lab = [
    "nett-mesh/lab",
    "dep:nett-relay",
    "nett-relay/lab",
    "dep:nett-transport",
]
