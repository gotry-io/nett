[package]
name = "nett-site"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Site: the model of machines, permissions and access rules, signing, and composing each machine's
# desired state from the model (design/site.md). The signing tool `nett site` and the Hub share this
# logic (design/hub.md section 4)

[dev-dependencies]
# Test directories removed when a test ends
tempfile.workspace = true

[lints]
workspace = true

[dependencies]
nett-core.workspace = true
nett-mesh.workspace = true
nett-trust = { workspace = true, features = ["signing", "backup"] }
ring.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
