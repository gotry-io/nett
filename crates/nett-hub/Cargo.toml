[package]
name = "nett-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nett-hub"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
lexopt.workspace = true
nett-core.workspace = true
nett-mesh.workspace = true
# The HTTPS client for fetching the release manifest (design/release.md section 7)
nett-node.workspace = true
nett-proto = { workspace = true, features = ["openapi"] }
nett-site.workspace = true
nett-trust = { workspace = true, features = ["backup"] }
prost.workspace = true
prost-types.workspace = true
ring.workspace = true
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true
utoipa.workspace = true
tracing-subscriber.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Test directories removed when a test ends
tempfile.workspace = true
http-body-util.workspace = true
# A new machine signs its admission proof in tests
nett-trust = { workspace = true, features = ["signing"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }
# axum already depends on tower's util: use it to hand requests directly to the router
tower = { version = "0.5.3", default-features = false, features = ["util"] }
