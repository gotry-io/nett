[package]
name = "nett-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The control protocol between nett-node and the Hub (design/protocol.md): Protobuf messages
# (generated from proto/ by nett-proto-gen), the Noise_IK_25519_ChaChaPoly_BLAKE2s channel and
# fragmentation. Encryption uses only ring, x25519-dalek and blake2, which are already in the
# dependency tree

[lints]
workspace = true

[dependencies]
base64.workspace = true
blake2.workspace = true
prost.workspace = true
prost-types.workspace = true
ring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Only in tests, interoperate with an independent Noise implementation to confirm that the handshake
# and transport messages are computed per the specification
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom", "std"] }
