[package]
name = "nett-mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nett-core.workspace = true
nett-trust.workspace = true
base64.workspace = true
bytes.workspace = true
gotatun.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync"] }
tracing.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
nett-trust = { workspace = true, features = ["signing"] }

[features]
# Lab build: JSON-lines event file, simulated clock error, transport adapter config file
# (design/prototype.md section 7),
# not enabled in official builds
lab = []
