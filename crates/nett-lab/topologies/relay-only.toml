# Relay smoke test and scenario 24: a is behind a cone NAT (dial-only), b is on the "public
# network"; between them there is only a candidate via the relay r1

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "dial-only"
behind = "nat-a"

[[node]]
name = "b"
reachability = "public"

[[node]]
name = "r1"
reachability = "public"
roles = ["relay"]

[[router]]
name = "nat-a"
nat = "cone"

[[link]]
peers = ["a", "b"]
candidates = ["relay:r1"]

# Scenarios send and receive between these members (access is denied by default, ADR 0023)
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
