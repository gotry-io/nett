# Relays through the Hub (design/hub.md section 9, H4): h runs the Hub and the site, r1 and r2 are
# public relays, and a and b are behind symmetric NATs, so hole punching between them cannot work and
# they connect through a relay. Every member joins through the Hub; candidates and the relay
# assignments come from the site, not from this file.

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "h"
reachability = "public"

[[node]]
name = "r1"
reachability = "public"

[[node]]
name = "r2"
reachability = "public"

[[node]]
name = "a"
reachability = "dial-only"
behind = "nat-a"

[[node]]
name = "b"
reachability = "dial-only"
behind = "nat-b"

[[router]]
name = "nat-a"
nat = "symmetric"

[[router]]
name = "nat-b"
nat = "symmetric"
