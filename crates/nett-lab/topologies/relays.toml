# 场景 2、3：a 在锥形 NAT 之后（dial-only），b 在"公网"上；两者之间只有经 r1、r2 的候选

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "dial-only"
behind = "nat-a"

[[node]]
name = "b"
reachability = "public"

[[node]]
name = "r1"
reachability = "public"
roles = ["relay"]

[[node]]
name = "r2"
reachability = "public"
roles = ["relay"]

[[router]]
name = "nat-a"
nat = "cone"

[[link]]
peers = ["a", "b"]
candidates = ["relay:r1", "relay:r2"]

# 场景在这些成员之间收发（访问默认拒绝，ADR 0023）
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
