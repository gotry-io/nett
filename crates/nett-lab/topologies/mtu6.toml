# Scenario 19 (IPv6): a is dial-only behind an IPv6 stateful firewall and connects directly to b on
# the "public network" over IPv6; MTU settings as in
# mtu4.toml

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "dial-only"
behind = "fw-a"

[[node]]
name = "b"
reachability = "public"

[[router]]
name = "fw-a"
nat = "ipv6-firewall"

[[link]]
peers = ["a", "b"]
candidates = ["direct6"]

# Scenarios send and receive between these members (access is denied by default, ADR 0023)
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
