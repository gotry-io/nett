# Access control, Edge addresses and container members (design/local-signing.md sections 6 and 8,
# ADR 0015, 0016, 0023): edge runs Edge (with a "container" behind it, and the node masquerades its
# traffic like Docker); app is a container member, behind a cone NAT, with a service behind it
# (equivalent to a container with a fixed address in a Docker network); it advertises the service's
# address, and only the Edge of edge is allowed to access port 8686 of the service; other is an
# ordinary member. Between members only app accessing the other two and edge accessing other are
# allowed; all other directions are denied by default

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "edge"
reachability = "public"
edge = { containers = ["172.17.0.2/32"] }

[[node]]
name = "app"
reachability = "dial-only"
behind = "nat-a"
routes = ["172.30.0.10/32"]
service = { address = "172.30.0.10", ingress = "172.30.0.200" }

[[node]]
name = "other"
reachability = "public"

[[router]]
name = "nat-a"
nat = "cone"

[[link]]
peers = ["edge", "app"]
candidates = ["direct"]

[[link]]
peers = ["other", "app"]
candidates = ["direct"]

[[link]]
peers = ["edge", "other"]
candidates = ["direct"]

[[allow]]
from = ["edge.edge"]
to = ["app.routes"]
ports = ["8686/tcp"]

[[allow]]
from = ["app"]
to = ["edge", "other"]

[[allow]]
from = ["edge"]
to = ["other"]
