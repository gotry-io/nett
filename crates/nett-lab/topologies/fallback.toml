# 场景 7、9、24：a 在锥形 NAT 之后（dial-only），b 在"公网"上；候选为直连、经 r1 的 UDP 中继与经 r1 的 TLS 传输

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "dial-only"
behind = "nat-a"

[[node]]
name = "b"
reachability = "public"

[[node]]
name = "r1"
reachability = "public"
roles = ["relay"]

[[router]]
name = "nat-a"
nat = "cone"

[[link]]
peers = ["a", "b"]
candidates = ["direct", "relay:r1", "relay-tls:r1"]
