# Scenarios 1 and 8: a is behind a cone NAT (dial-only) and connects directly to b (public), with
# additional candidates via the two relays r1 and r2

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "dial-only"
behind = "nat-a"

[[node]]
name = "b"
reachability = "public"

[[node]]
name = "r1"
reachability = "public"
roles = ["relay"]

[[node]]
name = "r2"
reachability = "public"
roles = ["relay"]

[[router]]
name = "nat-a"
nat = "cone"

[[link]]
peers = ["a", "b"]
candidates = ["direct", "relay:r1", "relay:r2"]

# Scenarios send and receive between these members (access is denied by default, ADR 0023)
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
