# 两个 public 节点经"公网"直连（场景 14：准入验证；两节点直连通信）

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "public"

[[node]]
name = "b"
reachability = "public"

[[link]]
peers = ["a", "b"]
candidates = ["direct"]

# 场景在这些成员之间收发（访问默认拒绝，ADR 0023）
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
