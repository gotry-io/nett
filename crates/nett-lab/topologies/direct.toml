# Two public nodes connect directly over the "public network" (scenario 14: admission verification;
# the two nodes communicate over a direct connection)

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "public"

[[node]]
name = "b"
reachability = "public"

[[link]]
peers = ["a", "b"]
candidates = ["direct"]

# Scenarios send and receive between these members (access is denied by default, ADR 0023)
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
