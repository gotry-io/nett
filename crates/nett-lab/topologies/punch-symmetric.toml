# Scenario 13: a and b are both behind a symmetric NAT (hole punching should not be attempted),
# start via the relays r1 and r2, and try hole punching; a and b each connect directly to r1 and r2
# and learn their own mapped address and NAT type from their replies

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "dial-only"
behind = "nat-a"

[[node]]
name = "b"
reachability = "dial-only"
behind = "nat-b"

[[node]]
name = "r1"
reachability = "public"
roles = ["relay"]

[[node]]
name = "r2"
reachability = "public"
roles = ["relay"]

[[router]]
name = "nat-a"
nat = "symmetric"

[[router]]
name = "nat-b"
nat = "symmetric"

[[link]]
peers = ["a", "b"]
candidates = ["relay:r1", "relay:r2", "punch"]

[[link]]
peers = ["a", "r1"]
candidates = ["direct"]

[[link]]
peers = ["a", "r2"]
candidates = ["direct"]

[[link]]
peers = ["b", "r1"]
candidates = ["direct"]

[[link]]
peers = ["b", "r2"]
candidates = ["direct"]

# Scenarios send and receive between these members (access is denied by default, ADR 0023)
[[allow]]
from = ["a", "b", "r1", "r2"]
to = ["a", "b", "r1", "r2"]
