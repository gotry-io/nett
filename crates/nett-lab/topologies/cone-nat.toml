# a is on the "public network", b is dial-only behind a cone NAT: b connects out to a, and a learns
# b's mapped address from the handshake

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "public"

[[node]]
name = "b"
reachability = "dial-only"
behind = "nat-b"

[[router]]
name = "nat-b"
nat = "cone"

[[link]]
peers = ["a", "b"]
candidates = ["direct"]

# Scenarios send and receive between these members (access is denied by default, ADR 0023)
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
