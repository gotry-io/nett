# Scenario 18: a and b are both on the "public network" and have two direct candidates, IPv4 and
# IPv6. The initial path is via a relay, and both direct candidates are of the better type from the
# start and are probed on the WireGuard port once every 3 seconds

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "public"

[[node]]
name = "b"
reachability = "public"

[[node]]
name = "r1"
reachability = "public"
roles = ["relay"]

[[link]]
peers = ["a", "b"]
candidates = ["relay:r1", "direct", "direct6"]

# Scenarios send and receive between these members (access is denied by default, ADR 0023)
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
