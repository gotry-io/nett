# 场景 18：a、b 都在"公网"上，有 IPv4、IPv6 两条直连候选。初始路径经中继，开始时两条直连候选都是
# 更优类型、每 3 秒在 WireGuard 端口上探测一次

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "public"

[[node]]
name = "b"
reachability = "public"

[[node]]
name = "r1"
reachability = "public"
roles = ["relay"]

[[link]]
peers = ["a", "b"]
candidates = ["relay:r1", "direct", "direct6"]

# 场景在这些成员之间收发（访问默认拒绝，ADR 0023）
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
