# 场景 19（IPv4）：a 是 dial-only，在锥形 NAT 之后，与"公网"上的 b 经 IPv4 直连。场景把"公网"这一段的
# MTU 依次设为 1500、1360、1300：a → b 的包在路由器上遇到瓶颈，b → a 的包由 b 自己按接口的 MTU 处理

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "dial-only"
behind = "nat-a"

[[node]]
name = "b"
reachability = "public"

[[router]]
name = "nat-a"
nat = "cone"

[[link]]
peers = ["a", "b"]
candidates = ["direct"]

# 场景在这些成员之间收发（访问默认拒绝，ADR 0023）
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
