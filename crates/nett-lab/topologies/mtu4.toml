# Scenario 19 (IPv4): a is dial-only behind a cone NAT and connects directly to b on the "public
# network" over IPv4. The scenario sets the MTU of the "public network" segment to 1500, 1360 and
# 1300 in turn: a -> b packets hit the bottleneck at the router, and b -> a packets are handled by b
# itself according to its interface MTU

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "dial-only"
behind = "nat-a"

[[node]]
name = "b"
reachability = "public"

[[router]]
name = "nat-a"
nat = "cone"

[[link]]
peers = ["a", "b"]
candidates = ["direct"]

# Scenarios send and receive between these members (access is denied by default, ADR 0023)
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
