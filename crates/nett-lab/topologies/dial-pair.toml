# 场景 16、17：a、b 都在锥形 NAT 之后（dial-only），两者之间只有经 r1、r2 的候选

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "dial-only"
behind = "nat-a"

[[node]]
name = "b"
reachability = "dial-only"
behind = "nat-b"

[[node]]
name = "r1"
reachability = "public"
roles = ["relay"]

[[node]]
name = "r2"
reachability = "public"
roles = ["relay"]

[[router]]
name = "nat-a"
nat = "cone"

[[router]]
name = "nat-b"
nat = "cone"

[[link]]
peers = ["a", "b"]
candidates = ["relay:r1", "relay:r2"]
