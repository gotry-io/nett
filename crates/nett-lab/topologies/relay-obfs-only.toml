# The cost of obfuscation (design/obfuscation.md section 9): as relay-only.toml, with the one
# candidate through r1 over obfuscated UDP; run the throughput scenario on both and compare

[mesh]
ipv4 = "100.88.0.0/16"
ipv6 = "fd00:88::/48"

[[node]]
name = "a"
reachability = "dial-only"
behind = "nat-a"

[[node]]
name = "b"
reachability = "public"

[[node]]
name = "r1"
reachability = "public"
roles = ["relay"]

[[router]]
name = "nat-a"
nat = "cone"

[[link]]
peers = ["a", "b"]
candidates = ["relay-obfs:r1"]

# Scenarios send and receive between these members (access is denied by default, ADR 0023)
[[allow]]
from = ["a", "b"]
to = ["a", "b"]
