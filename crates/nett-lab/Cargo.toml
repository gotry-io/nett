[package]
name = "nett-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
# Test directories removed when a test ends
tempfile.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
lexopt.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nett-core.workspace = true
nett-mesh.workspace = true
nett-relay = { workspace = true, features = ["lab"] }
# Hub scenarios (design/hub.md section 10): site state, join tokens, Hub configuration, and, when
# simulating a compromised Hub, directly rewriting its database
nett-hub.workspace = true
nett-node.workspace = true
nett-proto.workspace = true
nett-site.workspace = true
tokio = { workspace = true, features = ["rt"] }
nett-trust = { workspace = true, features = ["signing"] }
base64.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
x25519-dalek.workspace = true
